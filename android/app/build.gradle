// হিসাব খাতা — Android app: the live site https://erp-psi-woad.vercel.app in the app's own web view.
// Build: see android/README.md. The signing key is NOT in this repo (it is private).
plugins { id 'com.android.application' }

android {
    namespace 'com.krb.khata'
    compileSdk 36

    defaultConfig {
        applicationId 'com.krb.khata'
        minSdk 24   // Android 7.0 and newer
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KHATA_KEYSTORE') ?: 'khata-release.jks')
            storePassword System.getenv('KHATA_KEYSTORE_PASS')
            keyAlias 'khata'
            keyPassword System.getenv('KHATA_KEYSTORE_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'   // FileProvider (open saved PDFs on Android 7–9)
}
