.coy .cy-acts{display:flex;gap:8px;margin-top:10px}
.coy .cy-acts button{flex:1;padding:11px 8px;border-radius:9px;font-family:"Tiro Bangla",serif;font-weight:700;font-size:16px;background:var(--cy);color:#fff}
.coy .cy-acts button.ghost{background:#fff;color:var(--cy);border:1.5px solid var(--cy);flex:.7}
.coy .cy-acts button.danger{background:#fff;color:var(--cyr);border:1.5px solid var(--cyr);flex:.7}
.coy .cy-acts button.danger.armed{background:var(--cyr);color:#fff}
.coy .cy-acct{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.coy .cy-l{font-family:"Tiro Bangla",serif;font-weight:700;color:var(--cy);font-size:14px;white-space:nowrap}
.coy .cy-acct select{flex:1;min-width:0;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:18px;font-weight:700;color:var(--cyd);background:#fff;border:1.5px solid var(--cyl);border-radius:8px;padding:7px 8px}
.coy .cy-acct input{flex:1}
.coy .cy-ib{flex:none;width:40px;height:40px;border-radius:8px;background:#fff;color:var(--cy);border:1.5px solid var(--cy);font-size:17px;padding:0}
.coy .cy-ib.ok{background:var(--cy);color:#fff}
.coy .cy-ib.sm{width:28px;height:28px;font-size:13px;margin-left:4px;vertical-align:middle}
.coy .cy-tiles{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--cyc);border:1.5px solid var(--cy);border-radius:10px;overflow:hidden;margin-bottom:12px}
.coy .cy-tiles>div{padding:9px 12px;border-bottom:1px dashed var(--cyl);border-right:1px dashed var(--cyl)}
.coy .cy-tiles>div:nth-child(2n){border-right:0}
.coy .cy-tiles span{display:block;font-family:"Tiro Bangla",serif;font-size:12.5px;color:#4E6B57}
.coy .cy-tiles b{display:block;font-family:"Baloo Da 2","Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:20px;font-weight:700;color:var(--cyd)}
.coy .cy-tiles small{font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:12px;color:#4E6B57}
.coy .cy-tiles .big{grid-column:1 / -1;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:0;border-right:0;background:#fff}
.coy .cy-tiles .big span{font-size:15px;font-weight:700;color:var(--cyd)}
.coy .cy-tiles .big b{font-size:28px;color:var(--cyr)}
.coy .cy-tiles .big.adv b{color:var(--cy)}
.coy .cy-form{background:var(--cyc);border:1.5px solid var(--cy);border-radius:10px;padding:12px;margin-bottom:12px}
.coy .cy-form.rec{background:#F1F7EC}
.coy .cy-edhd{margin:0 0 8px;font-family:"Tiro Bangla",serif;font-weight:700;color:var(--cy)}
.coy .cy-seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--cy);border-radius:9px;overflow:hidden;margin-bottom:10px}
.coy .cy-seg button{padding:9px 4px;background:#fff;color:var(--cy);font-family:"Tiro Bangla",serif;font-weight:700;font-size:15px;border-radius:0;line-height:1.25}
.coy .cy-seg button small{display:block;font-size:11.5px;font-weight:600;opacity:.85}
.coy .cy-seg button[aria-pressed="true"]{background:var(--cy);color:#fff}
.coy .cy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.coy .cy-grid label{display:block;font-family:"Tiro Bangla",serif;font-size:13px;font-weight:700;color:#3F5E49}
.coy .cy-grid label input{margin-top:3px}
.coy .cy-grid .w2{grid-column:1 / -1}
.coy .cy-calc{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:13.5px;font-weight:600;color:var(--cy)}
.coy .cy-calc:empty{display:none}
.coy .cy-msg{margin:6px 0 0;font-size:13.5px;color:var(--cy)}
.coy .cy-msg:empty{display:none}
.coy .cy-msg.err{color:var(--cyr)}
/* the green ledger table */
.coy .cy-tw{background:var(--cyp);border:2px solid var(--cy);border-radius:6px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(46,125,79,.18) 33px,rgba(46,125,79,.18) 34px)}
.coy .cy-t{width:100%;border-collapse:collapse;table-layout:fixed}
.coy .cy-t th{background:#C5E4CB;color:var(--cyd);font-family:"Tiro Bangla",serif;font-size:13.5px;font-weight:700;padding:7px 5px;border-bottom:2px solid var(--cy);border-right:1px solid var(--cyl);text-align:left}
.coy .cy-t th small{display:block;font-size:10.5px;font-weight:600;color:#4E6B57}
.coy .cy-t th:first-child{width:40%}
.coy .cy-t th.n{text-align:right}
.coy .cy-t td{padding:7px 5px;vertical-align:top;border-bottom:1px solid var(--cyl);border-right:1px solid var(--cyl);font-family:"Baloo Da 2","Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:15.5px;font-weight:600;color:var(--cyd);overflow-wrap:anywhere}
.coy .cy-t th:last-child,.coy .cy-t td:last-child{border-right:0}
.coy .cy-t td.n{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coy .cy-t td.bal{color:var(--cyr)}
.coy .cy-t td.bal.adv{color:var(--cy)}
.coy .cy-t td.bal small{display:block;font-size:11px;font-family:"Tiro Bangla",serif}
.coy .cy-t td.cdt b{display:block;font-size:15px}
.coy .cy-t .tg{display:inline-block;margin:2px 0;padding:0 6px;border-radius:5px;font-family:"Tiro Bangla",serif;font-size:12px;font-weight:700}
.coy .cy-t .tg.inv{background:#FBE3E6;color:var(--cyr)}
.coy .cy-t .tg.rec{background:#D9F0DD;color:var(--cy)}
.coy .cy-t .ds{display:block;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:12.5px;font-weight:500;color:#3F5E49;line-height:1.35}
.coy .cy-t tr.r{cursor:pointer}
.coy .cy-t tr.r:hover td,.coy .cy-t tr.r.sel td{background:rgba(255,255,255,.55)}
.coy .cy-t tr.op td{background:rgba(255,255,255,.35)}
#company.coy .cy-t tr.op input{width:62%;padding:4px 6px;font-size:15px;display:inline-block}
.coy .cy-t tfoot td{background:#C5E4CB;border-top:2px solid var(--cy);border-bottom:0;font-family:"Tiro Bangla","Baloo Da 2",serif;font-weight:700}
@media (min-width: 900px){
  .coy .cy-tiles{grid-template-columns:repeat(3,1fr)}

#lhost .cmform.cmd .cm-field b.cm-sel,#ledger .cmform.cmd .cm-field b.cm-sel{padding:0 10px!important}

#lhost .cmform.cmd .cm-edit .cm-field input::placeholder,#ledger .cmform.cmd .cm-edit .cm-field input::placeholder{text-align:left}

/* ===== ডিজিটাল মেমো: step 1 = party; the rest opens after a party is chosen ===== */
.cmform.cmd #row_plain{display:none!important}
#lhost .cmform.cmd #fAddr,#ledger .cmform.cmd #fAddr{text-align:left!important}
#lhost .cmform.cmd #fAddr::placeholder,#ledger .cmform.cmd #fAddr::placeholder{text-align:left!important}
.cmform.cmd .cmd-pstep{display:none;margin:10px 16px 0}
.cmform.cmd.needparty .cmd-pstep{display:block}
.cmform.cmd .cmd-pstep p{margin:0 0 8px;font-size:13.5px;color:#6B7690}
.cmform.cmd .cmd-newp{width:100%;padding:11px;border-radius:12px;border:1.5px dashed #1F4AA8;background:#fff;color:#1F4AA8;font-weight:700;font-size:15px;cursor:pointer}
.cmform.cmd .cmd-newp:hover{background:#EEF3FB}
.cmform.cmd.needparty .cm > *:not(.cmd-hd):not(.cm-meta):not(.cm-name):not(.cmd-pstep):not(.bnkey){display:none!important}
.cmform.cmd.needparty .cm-acts .lbtn.solid{display:none!important}
.cmform.cmd.needparty .cm-acts{grid-template-columns:1fr!important}
.cmform.cmd.needparty #fHint{display:none}
/* when the rest opens, slide it in gently */
.cmform.cmd:not(.needparty) .cm > .cm-field:not(.cm-name),.cmform.cmd:not(.needparty) .cm > .cm-types{animation:cmdIn .25s ease}
@keyframes cmdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#lhost .cmform.cmd.needparty .cm > *:not(.cmd-hd):not(.cm-meta):not(.cm-name):not(.cmd-pstep):not(.bnkey),#ledger .cmform.cmd.needparty .cm > *:not(.cmd-hd):not(.cm-meta):not(.cm-name):not(.cmd-pstep):not(.bnkey){display:none!important}
#lhost .cmform.cmd.needparty .cm-acts .lbtn.solid,#ledger .cmform.cmd.needparty .cm-acts .lbtn.solid{display:none!important}

/* মেমো তালিকা: 🚚 মাল পাঠান right in the row */
.mrow .msend{display:inline-flex;align-items:center;gap:2px;margin-left:4px;padding:2px 10px;border-radius:999px;border:1.5px solid #1F7A3D;color:#1F7A3D;background:#fff;font-style:normal;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,transform .08s}
.mrow .msend:hover{background:#1F7A3D;color:#fff}
.mrow .msend:active{transform:scale(.92)}
.mrow .msend.sent{background:#1F7A3D;color:#fff;animation:qpop .45s ease}
.mrow .msend .qdots{display:inline-flex;margin-left:1px}
.mrow .msend .qdots b{display:inline-block;width:.4em;animation:qdot 1s infinite ease-in-out;opacity:.2}
.mrow .msend .qdots b:nth-child(2){animation-delay:.2s}
.mrow .msend .qdots b:nth-child(3){animation-delay:.4s}
.mrow.going{background:#E8F6EC!important;outline:2px dotted #1F7A3D;outline-offset:-2px}

/* ===== ডিজিটাল মেমো: each সফট / হার্ড = ONE box — its sizes on top, its মোট কেজি · দর · টাকা at the bottom ===== */
.cmform.cmd .cm-types{border:0!important;background:transparent!important;padding:0!important}
.cmform.cmd .cm-types > span{display:none!important}
#lhost .cmform.cmd .cm-types .cm-pickbtn,#ledger .cmform.cmd .cm-types .cm-pickbtn{width:100%;justify-content:center;padding:12px 16px!important;border-radius:12px!important;font-size:16px!important}
.cmform.cmd .cm-tbl tr.pkrow.hard,.cmform.cmd .cm-tbl tr#row_hard{--g:#6B3FA0;--gl:#F6F1FC}
.cmform.cmd .cm-tbl tr.pkrow.soft,.cmform.cmd .cm-tbl tr#row_soft{--g:#1F7A3D;--gl:#F1FAF4}
.cmform.cmd .cm-tbl tr.pkrow{margin:0!important;border-radius:0!important;border:1px solid #DCE3EF!important;border-top:0!important;border-left:4px solid var(--g)!important;border-bottom:1px dotted #DCE3EF!important;background:#fff!important;padding:8px 12px!important}
/* first size of a group = top of the box, with the group name */
.cmform.cmd .cm-tbl tr:not(.pkrow) + tr.pkrow,.cmform.cmd .cm-tbl tbody > tr.pkrow:first-child,.cmform.cmd .cm-tbl tr.pkrow.soft + tr.pkrow.hard{border-top:1px solid #DCE3EF!important;border-radius:12px 12px 0 0!important;margin-top:10px!important}
.cmform.cmd .cm-tbl tr:not(.pkrow) + tr.pkrow::before,.cmform.cmd .cm-tbl tbody > tr.pkrow:first-child::before,.cmform.cmd .cm-tbl tr.pkrow.soft + tr.pkrow.hard::before{grid-column:1 / -1;display:block;margin:-8px -12px 6px;padding:7px 12px;border-radius:9px 9px 0 0;background:var(--gl);color:var(--g);font-weight:800;font-size:14px}
.cmform .cm-tbl tr.pkmore td{padding:8px 0 4px!important;border:0!important;background:transparent!important}
.cmform.cmd .cm-tbl tr.pkmore{display:block!important;padding:0 10px}
.cmform.cmd .cm-tbl tr.pkmore td.pkm{display:block!important}
.cmform .cm-morebtn{width:100%;padding:11px;border-radius:10px;border:1.5px dashed #6B8FD6;background:#F4F7FD;color:#1F4AA8;font-weight:800;font-size:15px;cursor:pointer}
.cmform .cm-morebtn:hover{background:#E8EFFB}
.cmform .cm-tbl tr.pkrow .cmp-sl{display:inline-block;min-width:22px;margin-right:4px;font-family:"Baloo Da 2","Noto Sans Bengali",sans-serif;font-weight:800;color:#1F4AA8}
.cmform.cmd .cm-tbl tr.pkrow.hard::before{content:"হার্ড মাল — সাইজ ও কেজি"}
.cmform.cmd .cm-tbl tr.pkrow.soft::before{content:"সফট মাল — সাইজ ও কেজি"}
/* the সফট / হার্ড line right under its sizes = bottom of the same box */
.cmform.cmd .cm-tbl tr.pkrow + tr[id^="row_"]{margin-top:0!important;border-radius:0 0 12px 12px!important;border:1px solid #DCE3EF!important;border-top:1px dashed #C7D0DE!important;border-left:4px solid var(--g)!important;background:var(--gl)!important}
.cmform.cmd .cm-tbl tr.pkrow + tr[id^="row_"] td.d::before{content:"মোট";font-weight:800;color:var(--g);font-size:14px;margin-right:2px}
.cmform.cmd .cm-tbl tr.pkrow + tr[id^="row_"] td.d .mt{display:none}
#lhost .cmform.cmd .cm-tbl tr.pkrow + tr[id^="row_"] td.d input,#ledger .cmform.cmd .cm-tbl tr.pkrow + tr[id^="row_"] td.d input{background:#fff!important;font-size:14px!important;min-height:34px}
.cmform.cmd .cm-tbl tr.pkrow + tr[id^="row_"]{margin-bottom:10px!important}
/* মেমো ফর্ম (নতুন / বদলান): a bigger pop-up on a computer */
@media (min-width: 900px){
  #lhost .sheet-bg{padding:24px 24px 24px calc(var(--side, 196px) + 24px)!important;align-items:flex-start}
  #lhost .sheet{max-width:880px!important}
  #lhost .cmform.cmd .cm-sum b{font-size:22px!important}
  #lhost .cmform.cmd .cm-tbl tr{padding:12px 16px}
  #lhost .cmform.cmd .cmd-hd{padding:20px 24px 16px}
  #lhost .cmform.cmd .cmd-hd b{font-size:22px}
}
@media (min-width: 1300px){ #lhost .sheet{max-width:980px!important} }
/* big numbers never get cut in the মোট / অগ্রীম / বাকী tiles */
.cmform.cmd .cm-sum b{white-space:normal!important;overflow-wrap:anywhere;line-height:1.2}
#lhost .cmform.cmd .cm-field > b,#ledger .cmform.cmd .cm-field > b{justify-content:flex-start!important}
#lhost .cmform.cmd #fAddr,#ledger .cmform.cmd #fAddr,#lhost .cmform.cmd #fParty,#ledger .cmform.cmd #fParty{width:100%!important;flex:1;text-align-last:left!important}
#lhost .cmform.cmd .cm-field input,#ledger .cmform.cmd .cm-field input,#lhost .cmform.cmd .cm-tbl input,#ledger .cmform.cmd .cm-tbl input{text-align-last:left!important}
/* ডিজিটাল মেমো: no separate ঠিকানা box — the party name already shows it, e.g. "Abs (jah)" */
#lhost .cmform.cmd .cm-edit .cm-field.cm-addrf,#ledger .cmform.cmd .cm-edit .cm-field.cm-addrf{display:none!important}
/* the মোট কেজি box is a sum (not for typing): looks like a value, not an empty input */
#lhost .cm-tbl tr[id^="row_"] input[readonly],#ledger .cm-tbl tr[id^="row_"] input[readonly]{cursor:default}
#lhost .cmform.cmd .cm-tbl tr[id^="row_"] input[readonly],#ledger .cmform.cmd .cm-tbl tr[id^="row_"] input[readonly]{background:transparent!important;border:1px dashed #C7D0DE!important;font-weight:800;color:#1B2347}
#lhost .cmform.cmd .cm-tbl tr[id^="row_"] input[readonly]::placeholder,#ledger .cmform.cmd .cm-tbl tr[id^="row_"] input[readonly]::placeholder{font-size:12.5px;font-weight:600;color:#98A2B3}
#lhost .cm-tbl .cmp-kg.flash,#ledger .cm-tbl .cmp-kg.flash{animation:kgflash .9s ease}
@keyframes kgflash{0%,100%{box-shadow:0 0 0 0 rgba(31,74,168,0)}30%{box-shadow:0 0 0 4px rgba(31,74,168,.35)}}
/* ডিজিটাল মেমো: only ONE কেজি box to type in (the size's). The মোট and লেবার কেজি copies are hidden. */
.cmform.cmd .cm-tbl tr[id^="row_"] td:nth-child(3):has(input[readonly]){display:none!important}
.cmform.cmd .cm-tbl tr.lab td:nth-child(3){display:none!important}
.cmform.cmd .cm-tbl tr[id^="row_"]:has(td:nth-child(3) input[readonly]),.cmform.cmd .cm-tbl tr.lab{grid-template-columns:repeat(2,minmax(0,1fr))!important}

/* ডিজিটাল মেমো: group header is a real line now, with a "× বাদ দিন" badge in the corner */
.cmform.cmd .cm-tbl tr.pkrow::before{content:none!important;display:none!important}
.cmform:not(.cmd) .cm-tbl td.pk-grp{display:none!important}
.cmform.cmd .cm-tbl tr.pkrow td.pk-grp{order:-1;grid-column:1 / -1;display:flex!important;align-items:center;justify-content:space-between;gap:8px;margin:-8px -12px 6px!important;padding:7px 10px 7px 12px!important;border-radius:9px 9px 0 0;background:var(--gl)}
.cmform.cmd .cm-tbl tr.pkrow td.pk-grp::before{content:none!important;display:none!important}
.cmform.cmd .pk-gname{font-weight:800;font-size:14px;color:var(--g)}
.cmform.cmd .pk-rmall{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--g);background:#fff;color:var(--g);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cmform.cmd .pk-rmall:hover{background:var(--g);color:#fff}
.cmform.cmd .pk-rmall.armed{background:#C0152F;border-color:#C0152F;color:#fff}
.cmform.cmd .cm-tbl tr.pkrow.pkfirst{border-top:1px solid #DCE3EF!important;border-radius:12px 12px 0 0!important;margin-top:10px!important}

/* group header: the type name is a badge with its own × (remove the whole type) */
.cmform.cmd .cm-tbl tr.pkrow td.pk-grp{justify-content:flex-start!important}
.cmform.cmd .pk-gbadge{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 12px;border-radius:999px;background:var(--g);color:#fff;font-weight:800;font-size:14px}
.cmform.cmd .pk-gbadge .pk-rmall{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:16px;line-height:1;font-weight:800;cursor:pointer}
.cmform.cmd .pk-gbadge .pk-rmall:hover{background:rgba(255,255,255,.45)}
.cmform.cmd .pk-gbadge.armed{background:#C0152F}
.cmform.cmd .pk-gbadge .pk-rmall.armed{font-size:12px;padding:0 10px;background:#fff;color:#C0152F}
.cmform.cmd .pk-gsub{font-size:13px;font-weight:700;color:var(--g)}

/* memo confirm: full summary */
.kd-sum{max-height:70vh;overflow:auto;margin:0 -4px;padding:0 4px}
.kd-sum .kd-sec{margin:12px 0 4px;font-size:12.5px;font-weight:800;color:#6B7690;letter-spacing:.2px;border-bottom:1px solid #E3E8F0;padding-bottom:3px}
.kd-sum .kd-row.sm span,.kd-sum .kd-row.sm b{font-size:13.5px}
.kd-sum .kd-row span small{font-size:12px;color:#8A93A6;margin-left:4px}
.kd-sum .kd-chip{font-style:normal;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:#EEF3FB;color:#1F4AA8;margin-right:4px}
.kd-sum .kd-chip.hard{background:#EDE3F7;color:#6B3FA0}
.kd-sum .kd-chip.soft{background:#DDF2E4;color:#1F7A3D}
.kd-sum .kd-row.due{background:#FDECEE;border-radius:8px;padding-left:8px;padding-right:8px}
.kd-sum .kd-row.due b{color:#C0152F}
.kdlg,.kd{max-width:520px}
/* ডিজিটাল মেমো: লেবার খরচ stays hidden until a মাল type is picked */
#lhost .cmform.cmd.nogoods .cm-tbl tr.lab,#ledger .cmform.cmd.nogoods .cm-tbl tr.lab{display:none!important}
/* ডিজিটাল মেমো: no "হার্ড মাল / সফট মাল" description box next to মোট */
#lhost .cmform.cmd .cm-tbl tr[id^="row_"] td.d input.cm-desc,#ledger .cmform.cmd .cm-tbl tr[id^="row_"] td.d input.cm-desc{display:none!important}
.cmform.cmd .cm-tbl tr.pkrow + tr[id^="row_"] td.d::before{content:"মোট হিসাব"!important}

/* ===== স্টকে মাল কম ===== */
.kdlg.warn .kd-ic,.kdlg.err .kd-ic{font-size:34px}
.kdlg.warn h3{color:#B45309}
.kdlg.err h3{color:#C0152F}
.kdlg.err .kd-ok{background:#C0152F!important;border-color:#C0152F!important}
.kdlg.warn .kd-ok{background:#B45309!important;border-color:#B45309!important}
.kd-body .kd-lead{margin:0 0 6px;font-size:14px;color:#475467}
.kd-body .kd-row.shr{background:#FFF7F7;border:1px solid #F6D5DB;border-radius:10px;padding:8px 10px;margin-top:8px}
.kd-body .kd-row.shr b{color:#B3122B}
.kd-body .kd-sub{margin:3px 4px 0;font-size:12.5px;color:#6B7690;text-align:left}

.kd-body .kd-chip{font-style:normal;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:#EEF3FB;color:#1F4AA8;margin-right:4px}
.kd-body .kd-chip.hard{background:#EDE3F7;color:#6B3FA0}
.kd-body .kd-chip.soft,.kd-body .kd-chip.soft2{background:#DDF2E4;color:#1F7A3D}

@media (max-width: 600px){ #stock .qlist.qtab > li.qrow.short{grid-template-areas:"sl main main" "sl kg act" "sl sh sh"} #stock .qlist.qtab > li.qrow .qshort{grid-area:sh} }
.mrow .mshort{font-style:normal;font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px;background:#FDECEE;color:#B3122B;border:1px solid #F3A9B5;white-space:nowrap}

/* মেমো তালিকা: কেনা · বিক্রি · লাভ */
.mrow .mm .mprof{display:block;margin-top:3px;font-size:12.5px;color:#475467}

<script>
// same page header everywhere: title on the left, date pill on the right (same place, same look on every tab)
function bnLongDate(iso){
  const BD = '০১২৩৪৫৬৭৮৯', tb = v => String(v).replace(/[0-9]/g, d => BD[d]);
  const [y,m,d] = String(iso).split('-').map(Number), x = new Date(y, m-1, d);
  return ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'][x.getDay()] + ', ' + tb(d) + ' '
    + ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'][m-1] + ' ' + tb(y);
}
function isoNow(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function uHead(title, sub){
  return `<header class="uhd"><div class="uhd-l">${sub ? `<p class="book">${sub}</p>` : ''}<h1 class="uhd-t">${title}</h1></div>`
    + `<div class="uhd-r"><span class="navsp" aria-hidden="true"></span><span class="udp"><span class="ud-ic">${calSvg()}</span><span class="ud-t">${bnLongDate(isoNow())}</span></span><span class="navsp" aria-hidden="true"></span></div></header>`;
}
// tap anywhere on the date pill → the calendar opens (pick any day directly)
document.addEventListener('click', e => {
  const l = e.target.closest && e.target.closest('.uhd label.udp'); if(!l) return;
  const inp = l.querySelector('input[type="date"]'); if(!inp || typeof inp.showPicker !== 'function') return;
  e.preventDefault(); try{ inp.showPicker(); }catch(_){ inp.focus(); }
});
const goTodayBtn = id => `<button type="button" class="gotoday" id="${id}">↩ বর্তমান দিনে ফিরে যান</button>`;
// calendar icon drawn in code (the 📅 emoji always shows "JUL 17" on iPhone)
function calSvg(day){
  const t = day ? `<text x="12" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="Hind Siliguri, sans-serif">${day}</text>` : `<g fill="currentColor"><rect x="6" y="11.5" width="3" height="3" rx=".6"/><rect x="10.5" y="11.5" width="3" height="3" rx=".6"/><rect x="15" y="11.5" width="3" height="3" rx=".6"/><rect x="6" y="16" width="3" height="3" rx=".6"/><rect x="10.5" y="16" width="3" height="3" rx=".6"/></g>`;
  return `<svg class="calsvg" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><rect x="2.5" y="4" width="19" height="17.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9h19" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 2.5v3.5M16.5 2.5v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>${t}</svg>`;
}
// kg of goods on a খরচ (মাল কিনেছে) line: saved kg, or read from the "(কেজি×রেট)" note
function entryKg(e){
  if(!(Number(e.credit) > 0)) return 0;
  if(e.kg != null) return Number(e.kg) || 0;
  const m = (e.desc||'').match(/\(([০-৯0-9.,]+)\s*[×x]/);
  if(!m) return 0;
  const v = parseFloat(m[1].replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/,/g,''));
  return isFinite(v) ? v : 0;
}
// type badges for a goods line: সফট / হার্ড (one or both)
function mtBadges(e){
  const L = {soft:'সফট', hard:'হার্ড'};
  if(e.items && e.items.length) return e.items.map(x => `<b class="mt mt-${x.t}">${L[x.t]}</b>`).join(' ');
  if(e.mtype && L[e.mtype]) return `<b class="mt mt-${e.mtype}">${L[e.mtype]}</b>`;
  return '';
}
// next memo number across every party
function nextMemoNo(){
  const L = window.__ledger; let m = 0;
  if(L) L.accs().forEach(a => (a.entries||[]).forEach(e => { if(Number(e.credit) > 0 && (e.memoNo||0) > m) m = e.memoNo; }));   // টাকা জমা is not a memo
  return m + 1;
}
// party name with ঠিকানা in brackets, e.g. Riad (Bagber)
const markOf = it => it.mark === 'K' ? 'K' : '';   // the old B (red) mark is no longer used
const markBtns = (pre, cur) => ['K'].map(m => `<button type="button" class="zbtn ${m.toLowerCase()}" id="${pre}${m}" data-mark="${m}" aria-pressed="${cur === m}" title="${m} মাল — ${m === 'B' ? 'লাল' : 'সবুজ'} দেখাবে">${m}</button>`).join('');
// B / K buttons: tap one to choose it, tap again to clear
function wireMarks(pre){ const bs = ['B','K'].map(m => document.getElementById(pre + m)).filter(Boolean); bs.forEach(b => b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; bs.forEach(x => x.setAttribute('aria-pressed', x === b && on)); }); }
const pickedMark = pre => ((['B','K'].map(m => document.getElementById(pre + m)).find(b => b && b.getAttribute('aria-pressed') === 'true')) || {}).dataset?.mark || '';
// party names: first letter of each word capital (arafat steel → Arafat Steel); Bangla is left as it is
const capName = v => String(v||'').replace(/(^|[\s(.\-\/])([a-z])/g, (m, a, b) => a + b.toUpperCase());
document.addEventListener('input', e => {
  const el = e.target; if(!el || !['npName','fNewParty','aNewName','accName','arName','npAddr','fNewLoc','aNewAddr','fAddr'].includes(el.id)) return;
  const v = capName(el.value); if(v === el.value) return;
  const pos = el.selectionStart; el.value = v; try{ el.setSelectionRange(pos, pos); }catch(_){}
});
function pnm(a){ return a.name + (a.address ? ' (' + a.address + ')' : ''); }
// ---- Banglish → বাংলা while typing (English keyboard, sound-based) ----
const BN_WORDS = {dhaka:'ঢাকা',bangladesh:'বাংলাদেশ',keraniganj:'কেরাণীগঞ্জ',narayanganj:'নারায়ণগঞ্জ',gazipur:'গাজীপুর',chittagong:'চট্টগ্রাম',chattogram:'চট্টগ্রাম',
  mohammad:'মোহাম্মদ',mohammed:'মোহাম্মদ',muhammad:'মুহাম্মদ',md:'মোঃ',bhai:'ভাই',abdul:'আব্দুল',abdullah:'আব্দুল্লাহ',rahman:'রহমান',islam:'ইসলাম',hossain:'হোসেন',
  hossen:'হোসেন',uddin:'উদ্দিন',ahmed:'আহমেদ',alam:'আলম',steel:'স্টিল',store:'স্টোর',traders:'ট্রেডার্স',enterprise:'এন্টারপ্রাইজ',bazar:'বাজার',road:'রোড',

      <h3 class="qh qh2 gone"><span>✓ ${cur.id === todayId() ? 'আজকের দিনে মাল গেছে' : 'এই দিনে মাল গেছে'}</span><span class="qc">${toBn(today.length)}টা</span></h3>

        : `<li class="empty qnone"><span class="qe-i">📭</span><b>${cur.id === todayId() ? 'আজকে' : 'এই দিনে'} এখনো কোনো মাল যায়নি</b><small>উপরের লিস্ট থেকে "✓ গেছে" চাপলে এখানে আসবে</small></li>`}</ol>`;
  }
  function goodsLines(){
    const L = window.__ledger, ids = days.map(d=>d.id), out = [];
    if(!L) return out;
    L.accs().forEach(a => (a.entries||[]).forEach(e => {
      const kg = entryKg(e); if(!(kg > 0)) return;
      let day = null;
      if(e.status === 'confirmed' && ids.length){ const on = e.confirmedOn || e.date; day = ids[0]; for(const id of ids){ if(id <= on) day = id; } }
      out.push({a, e, kg, done: e.status === 'confirmed', day});
    }));
    // newest first: later date on top; same date → the one made later (memo no. / time) on top
    return out.sort((x,y)=> x.e.date > y.e.date ? -1 : x.e.date < y.e.date ? 1 : ((y.e.memoNo||0) - (x.e.memoNo||0)) || ((y.e.ts||0) - (x.e.ts||0)));
  }
  const shortD = id => { const [y,m,d] = id.split('-'); return toBn(d+'/'+m+'/'+y.slice(2)); };
  function pendingKg(){
    const L = window.__ledger; let kg = 0, n = 0;
    if(L) L.accs().forEach(a => (a.entries||[]).forEach(e => { const k = entryKg(e); if(k > 0 && e.status !== 'confirmed'){ kg += k; n++; } }));
    return {kg, n};
  }
  function calc(){
    const m = {}; let prevTot = null; const sold = soldMap();
    days.forEach((d,i)=>{
      const open = i===0 ? (Number(d.opening)||0) : prevTot;
      const sd = (sold[d.id] || 0) + sumOuts(d);
      const net = open - (Number(d.due)||0) - sd;
      const tot = net + sumEntries(d);
      m[d.id] = {open, net, tot, sum: sumEntries(d), sold: sd};
      prevTot = tot;
    });
    return m;
  }
  const sortDays = () => days.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  window.__stock = { days: () => days, calc: () => calc(), render: () => { if(viewId) render(); },
    // new day: open today's page carrying yesterday's total; jump there if you were on the last day
    rollover: () => { if(!viewId) return; const wasLast = viewId === lastDay().id; ensureToday(); if(wasLast) viewId = lastDay().id; render(); },
    removeByLink: ce => { for(const d of days){ const i = (d.entries||[]).findIndex(e => e.ce === ce); if(i >= 0){ d.entries.splice(i,1); saveDay(d,true); if(viewId) render(); return true; } } return false; } };
  const findDay = id => days.find(d=>d.id===id);
  const lastDay = () => days[days.length-1];

  /* ---------- storage ---------- */
  function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }catch(e){ return []; } }
  function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(days)); }catch(e){} }
  async function loadAll(){
    if(db){
      try{
        const snap = await db.collection('days').get();
        days = snap.docs.filter(s=>s.exists).map(s=>JSON.parse(JSON.stringify(s.data())));
      }catch(e){ days = lsLoad(); db = null; }
    } else days = lsLoad();
    sortDays();
  }
  let autoSendT = 0;
  function saveDay(d, now){
    lsSave();
    // more stock may let a waiting memo go out by itself
    clearTimeout(autoSendT); autoSendT = setTimeout(() => { if(window.__ledger && window.__ledger.autoSend) window.__ledger.autoSend(false); }, 400);
    if(!db) return;
    clearTimeout(saveTimers[d.id]);
    const run = () => db.doc('days/'+d.id).set(JSON.parse(JSON.stringify(d))).catch(()=>{});
    if(now) run(); else saveTimers[d.id] = setTimeout(run, 500);
  }
  function removeDay(id){
    const idx = days.findIndex(d=>d.id===id);
    if(idx===0 && days[1]){ days[1].opening = days[0].opening; saveDay(days[1],true); }
    days = days.filter(d=>d.id!==id); lsSave();
    if(db) db.doc('days/'+id).delete().catch(()=>{});
  }
  function newDay(id){ return {id, opening:0, due:0, entries:[]}; }
  function addDay(id){
    const d = newDay(id);
    if(days.length && id < days[0].id){ d.opening = days[0].opening; } // new start day keeps the starting total
    days.push(d); sortDays(); saveDay(d,true); return d;
  }

  function ensureToday(){
    const t = todayId();
    if(!days.length){ addDay(t); return; }
    if(lastDay().id < t) addDay(t);
  }

  /* ---------- two-tap confirm (popups are blocked in the app) ---------- */
  function twoTap(btn, armedText, ms, action){

  function go(id){ viewId = id; editIndex = -1; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  // 📜 মাল আসার ইতিহাস: only the day on screen (its গাড়ি → মাল); "এই মাসের সব হিসাব" opens the whole month date-wise
  const openCars = new Set();   // which গাড়ি lines are open (day list + history)

  // ✎ on a গাড়ি (day list or month pop-up): open that day with the মাল pop-up filled — change মাল, কেজি, কয়েল, গাড়ি নং, কোম্পানি, দর, চালান

      // land on that day's গাড়ি table (not the top of the page)

  // ✋ হাতে মাল বের করুন: pick মার্কা → সাইজ + মোট কেজি, ＋ আরো মাল for the next one; saved as the day's outs (leave the stock)
  function openHandOut(cur){

    app.innerHTML = head + `
      ${(()=>{ const p = pendingKg(); return `

      if(lastItemId && !clr){ clr = document.createElement('button'); clr.type = 'button'; clr.className = 'pkclr'; clr.id = 'pickClr'; clr.setAttribute('aria-label','মাল বাদ দিন'); clr.textContent = '×'; $('pickBtn').after(clr); clr.onclick = () => setPick(''); }
      if(!lastItemId && clr) clr.remove();
    };
    $('pickBtn').onclick = () => openPicker(cur.id, id => { setPick(id); kg.focus(); });
    // ＋ আরো মাল: more sizes on the same গাড়ি — each line = its own মাল + কেজি
    const addXRow = pre => {
      const r = document.createElement('div'); r.className = 'xrow';
      r.innerHTML = `<div class="pkrow"><button type="button" class="pkbtn xpk" data-item="">${pickHtml(cur.id, '')}</button></div><input class="num xkg" inputmode="decimal" aria-label="কেজি"><span class="xcw"><input class="xcoil" aria-label="কয়েল নং" placeholder="কয়েল নং" autocomplete="off"><button type="button" class="xdel" aria-label="এই মাল বাদ দিন">×</button></span>`;
      const pb = r.querySelector('.xpk'), kIn = r.querySelector('.xkg');
      pb.onclick = () => openPicker(cur.id, id => { pb.dataset.item = id || ''; pb.innerHTML = pickHtml(cur.id, id || ''); kIn.focus(); });
      r.querySelector('.xdel').onclick = () => r.remove();
      kIn.addEventListener('input', paintCo);
      kIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); r.querySelector('.xcoil').focus(); } });
      r.querySelector('.xcoil').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('xMore').focus(); } });
      $('xRows').appendChild(r);
      if(pre && pre.kg != null){ pb.dataset.item = pre.item || ''; pb.innerHTML = pickHtml(cur.id, pre.item || ''); kIn.value = toBn(pre.kg); r.querySelector('.xcoil').value = pre.coil || ''; }
      else pb.click();
    };
    $('xMore').onclick = () => addXRow();
    if($('pickClr')) $('pickClr').onclick = () => setPick('');
    const paintCo = () => {
      const k = parseNum(kg.value), r = parseNum(coRate.value);
      const xs = [...document.querySelectorAll('#xRows .xkg')].reduce((a, x) => a + (parseNum(x.value) > 0 ? parseNum(x.value) : 0), 0);
      coCalc.textContent = box.classList.contains('withco') && k > 0 && r > 0 && !xs ? `${toBn((k/1000).toLocaleString('en-IN',{maximumFractionDigits:3}))} টন × ${bn(r)} = ${bn(Math.round(k/1000*r))} ৳ (কোম্পানির খতিয়ানে ডেবিট)` : '';
    };
    [kg, coRate].forEach(x => x.addEventListener('input', paintCo)); paintCo();
    if(coSel) coSel.onchange = () => {
      if(coSel.value === '__new'){ coNew = true; render(); const n = $('coNewIn'); if(n) n.focus(); return; }
      lastCo = coSel.value; try{ localStorage.setItem('kg-khata-lastco', lastCo); }catch(_){}
      box.classList.toggle('withco', !!lastCo);
      coRate.value = lastCo && C && C.lastRate(lastCo) ? toBn(C.lastRate(lastCo)) : '';
      paintCo();
    };
    if($('coNewOk')){
      const okNew = () => { const nm = $('coNewIn').value.trim(); if(!nm){ $('coNewIn').focus(); return; } lastCo = C.create(nm); coNew = false; try{ localStorage.setItem('kg-khata-lastco', lastCo); }catch(_){}; render(); const m = $('kg'); if(m) m.focus(); };
      $('coNewOk').onclick = okNew;
      $('coNewIn').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); okNew(); } });
      $('coNewNo').onclick = () => { coNew = false; render(); };
      if(typeof attachBanglish === 'function') attachBanglish($('coNewIn'));
    }
    const add = () => {
      const n = parseNum(kg.value);
      if(isNaN(n) || n<=0){ hint.textContent='সঠিক কেজি লিখুন।'; hint.className='hint err'; kg.focus(); return; }
      // the first line + every ＋ আরো মাল line (an empty extra line is skipped)
      const lines = [{kg:n, coil:$('coilNo').value.trim(), itId: box.classList.contains('detopen') && itemSel.value && itemSel.value !== '__new' ? itemSel.value : ''}];
      for(const x of document.querySelectorAll('#xRows .xrow')){
        const xk = parseNum(x.querySelector('.xkg').value), xi = x.querySelector('.xpk').dataset.item || '';
        if(!xi && !(xk > 0)) continue;
        if(!(xk > 0)){ hint.textContent = 'প্রতিটা মালের কেজি লিখুন।'; hint.className = 'hint err'; x.querySelector('.xkg').focus(); return; }
        lines.push({kg:xk, itId:xi, coil:x.querySelector('.xcoil').value.trim()});
      }
      const coId = coSel ? coSel.value : '';
      const withCo = coId && coId !== '__new' && C, rate = parseNum(coRate.value);
      if(withCo && !(rate > 0) && !carEdit){ hint.textContent = 'কোম্পানির দর (প্রতি টন) লিখুন।'; hint.className = 'hint err'; coRate.focus(); return; }
      cur.entries = cur.entries||[];
      const ts = Date.now(), olds = carEdit ? carEdit.map(i => cur.entries[i]).filter(Boolean) : [], rows = [];
      if(carEdit) olds.forEach(o => { if(o.co && o.ce && C) C.remove(o.co, o.ce); });   // old চালান lines go, new ones are written below
      lines.forEach((ln, i) => {
        const row = {kg:ln.kg, car:toBn(car.value.trim()), ts:olds[i] && olds[i].ts ? olds[i].ts : (olds.length ? olds[olds.length-1].ts + i : ts + i)};
        if(olds[i] && olds[i].ci) row.ci = olds[i].ci;
        if(ln.coil) row.coil = ln.coil;
        let picked = null;
        const f = ln.itId ? findItem(ln.itId) : null;
        if(f){
          row.cat = f.c.id; row.item = ln.itId;
          if(i === 0){ lastItemId = ln.itId; try{ localStorage.setItem('kg-khata-lastitemid', lastItemId); }catch(_){} }
          picked = {c:f.c, it:f.it};
        }
        if(withCo){
          row.co = coId; if(coVno.value.trim()) row.vno = coVno.value.trim();
          row.ce = C.addInv({coId, date:cur.id, kg:ln.kg, mili:0, size:picked && picked.it ? picked.it.h : 0, len:picked && picked.it ? picked.it.w : 0, item:picked ? picked.c.name : '', mt:'', rate:rate > 0 ? rate : 0, vno:coVno.value.trim(), car:row.car});
        }
        rows.push(row);
      });
      if(carEdit){ const at = Math.min(...carEdit); cur.entries = cur.entries.filter((e, i) => !carEdit.includes(i)); cur.entries.splice(Math.min(at, cur.entries.length), 0, ...rows); }
      else cur.entries.push(...rows);
      const was = carEdit; carEdit = null;
      addOpen = false; saveDay(cur,true); editIndex=-1; render();   // saved → pop-up closes, the new গাড়ি shows in the list
      const r = $('lastRow'); if(r && !was) r.classList.add('flash');
      kToast(was ? '✓ গাড়ির মাল বদলানো হয়েছে' : '✓ মাল যোগ হয়েছে');
    };
    $('addBtn').onclick = add;
    const showAdd = on => { addOpen = on; $('addWrap').hidden = !on; document.body.classList.toggle('addmodal-on', on); if(on) setTimeout(() => $('kg').focus(), 30); if(!on && carEdit){ carEdit = null; render(); } };
    // ✎ গাড়ি: fill the pop-up with that গাড়ি's lines
    if(carEdit && addOpen){
      const es = carEdit.map(i => cur.entries[i]).filter(Boolean);
      if(!es.length){ carEdit = null; addOpen = false; render(); return; }
      const e0 = es[0], co = es.find(e => e.co) || null;
      if(coSel){ coSel.value = co && C && C.list().find(x => x.id === co.co) ? co.co : ''; box.classList.toggle('withco', !!coSel.value); }
      const inv = co && C && C.inv ? C.inv(co.co, co.ce) : null;
      coRate.value = inv && Number(inv.rate) ? toBn(inv.rate) : '';
      coVno.value = (es.find(e => e.vno) || {}).vno || '';
      setPick(e0.item && findItem(e0.item) ? e0.item : '');
      kg.value = toBn(e0.kg); $('coilNo').value = e0.coil || ''; car.value = e0.car ? toBn(e0.car) : '';
      es.slice(1).forEach(e => addXRow({item: e.item && findItem(e.item) ? e.item : '', kg: e.kg, coil: e.coil || ''}));
      paintCo();
      if($('carDelBtn')) twoTap($('carDelBtn'), 'নিশ্চিত? আবার চাপুন', 4000, () => {
        es.forEach(o => { if(o.co && o.ce && C) C.remove(o.co, o.ce); });
        const idx = carEdit; cur.entries = cur.entries.filter((e, i) => !idx.includes(i));
        carEdit = null; addOpen = false; saveDay(cur, true); render(); kToast('🗑 গাড়ির মাল মুছে ফেলা হয়েছে');
      });
    }
    $('addOpenBtn').onclick = () => showAdd(true);
    $('addCloseBtn').onclick = () => showAdd(false);
    $('addWrap').onclick = e => { if(e.target === $('addWrap')) showAdd(false); };
    $('addWrap').onkeydown = e => { if(e.key === 'Escape' && !document.querySelector('.pk-bg, .kdlg-bg')) showAdd(false); };
    document.body.classList.toggle('addmodal-on', addOpen || coNew);
    kg.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('coilNo').focus(); }});
    $('coilNo').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); car.focus(); }});
    car.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(box.classList.contains('withco')) coRate.focus(); else add(); }});
    coRate.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); coVno.focus(); }});
    coVno.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); }});

    if($('histTg')) $('histTg').onclick = () => { histOpen = !histOpen; try{ localStorage.setItem('kg-khata-hist', histOpen ? '1' : '0'); }catch(_){}; render(); };
    if($('histMon')) $('histMon').onclick = openMonth;
    document.querySelectorAll('#stock [data-hday]').forEach(b => b.onclick = () => go(b.dataset.hday));
    document.querySelectorAll('#stock [data-hdt]').forEach(b => b.onclick = () => { const k = 'd|' + b.dataset.hdt; if(openCars.has(k)) openCars.delete(k); else openCars.add(k); render(); });
    document.querySelectorAll('#stock [data-hkey]').forEach(b => b.onclick = () => { const k = b.dataset.hkey; if(openCars.has(k)) openCars.delete(k); else openCars.add(k); render(); });
    document.querySelectorAll('#stock .cedit').forEach(b => b.onclick = ev => { ev.stopPropagation(); startCarEdit(b.dataset.cday, b.dataset.cidx.split(',').map(Number)); });
    document.querySelectorAll('#stock [data-ckey]').forEach(li => li.onclick = () => { const k = li.dataset.ckey; if(openCars.has(k)) openCars.delete(k); else openCars.add(k); render(); });
    document.querySelectorAll('#stock .edit').forEach(b=>b.onclick=()=>{ editIndex=+b.dataset.i; render(); const ek=$('ek'); if(ek){ ek.focus(); ek.select(); } });
    if($('saveEdit')){
      const doSave = ()=>{
        const ek=$('ek'), ec=$('ec'); const n=parseNum(ek.value);
        if(isNaN(n)||n<=0){ ek.classList.add('bad'); ek.focus(); return; }
        const old = cur.entries[editIndex] || {};
        const row = {kg:n, car:ec.value.trim()};
        { const cl = $('ecoil') ? $('ecoil').value.trim() : (old.coil || ''); if(cl) row.coil = cl; }
        if(old.cat){ row.cat = old.cat; if(old.item) row.item = old.item; }
        if(old.b) row.b = true;
        if(old.ts) row.ts = old.ts;
        else if($('em')){
          const mi = parseNum($('em').value), sz = parseNum($('es').value), ln = parseNum($('el').value), nm = $('eitm').value.trim(), et = $('emt').value;
          if(mi > 0) row.mili = mi; if(sz > 0) row.size = sz; if(ln > 0) row.len = ln; if(nm) row.item = nm; if(et) row.mt = et;
        }
        if(old.co){ row.co = old.co; row.ce = old.ce; if(window.__company) window.__company.updateInv(old.co, old.ce, old.cat ? {kg:n, car:row.car} : {kg:n, mili:row.mili||0, size:row.size||0, len:row.len||0, item:row.item||'', mt:row.mt||'', car:row.car}); }
        cur.entries[editIndex] = row;
        saveDay(cur,true); editIndex=-1; render();
      };
      $('saveEdit').onclick = doSave;
      $('cancelEdit').onclick = ()=>{ editIndex=-1; render(); };
      [$('eitm'),$('em'),$('es'),$('el'),$('ek'),$('ec'),$('ecoil')].forEach(x=>{ if(x) x.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doSave(); }}); });
      if($('eitm')){ makeCombo($('eitm'), () => opts('item')); makeCombo($('em'), () => opts('mili')); makeCombo($('es'), () => opts('size')); makeCombo($('el'), () => opts('len')); }
    }

    document.querySelectorAll('#stock .del').forEach(b=>{
      const i = +b.dataset.i;
      twoTap(b,'মুছুন',4000,()=>{ const gone = cur.entries[i]; if(gone && gone.co && window.__company) window.__company.remove(gone.co, gone.ce); cur.entries.splice(i,1); saveDay(cur,true); editIndex=-1; render(); });
    });
    bindDayEnd(cur, isLast);
  }

  function bindDayEnd(cur, isLast){
    const $ = id => document.getElementById(id);

    if(!isLast && $('backBtn')) $('backBtn').onclick = ()=>go(lastDay().id);
    const dd=$('delDayBtn');
    if(dd) twoTap(dd,'নিশ্চিত? আবার চাপুন',4000,()=>{
      const id=cur.id; removeDay(id);
      const prev=[...days].reverse().find(d=>d.id<id) || days[0];
      go(prev.id);
    });
  }

  /* ---------- start ---------- */
  async function start(){
    db = await getDB();
    await loadAll();
    if(db){ try{ const d = await db.doc('settings/cats').get(); if(d.exists && Array.isArray(d.data().list) && d.data().list.length) cats = JSON.parse(JSON.stringify(d.data().list)); else saveCats(); }catch(_){} }
    ensureToday();
    viewId = lastDay().id;
    render();
    if(window.__dashRender) window.__dashRender();
  }
  start();
})();

/* ================= 🏭 কোম্পানি খাতা: মাল আসা (চালান = ডেবিট) + টাকা দেওয়া (রসিদ = ক্রেডিট), ক্লোজিং ================= */
(function(){
  const LS = 'kg-khata-company-v1', LSCUR = 'kg-khata-company-cur', LSLAST = 'kg-khata-cy-last';
  const BD = '০১২৩৪৫৬৭৮৯';
  const toBn = s => String(s).replace(/[0-9]/g, d => BD[d]);
  const toEn = s => String(s).replace(/[০-৯]/g, c => BD.indexOf(c));
  const num = s => { const n = parseFloat(toEn(s).replace(/[, ]/g, '')); return isFinite(n) ? n : NaN; };
  const bn = n => toBn(Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2}));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const shortD = iso => { const [y,m,d] = String(iso).split('-'); return toBn(d+'/'+m+'/'+String(y).slice(2)); };
  let cos = [], cur = null, db = null;
  const ui = {mode:'inv', editId:null, adding:false, renaming:false, openEdit:false, msg:''};
  let last = {item:'', size:1250, rate:''};
  try{ cos = JSON.parse(localStorage.getItem(LS)) || []; }catch(_){}
  try{ cur = localStorage.getItem(LSCUR) || null; }catch(_){}
  try{ last = Object.assign(last, JSON.parse(localStorage.getItem(LSLAST)) || {}); }catch(_){}
  const co = () => cos.find(c => c.id === cur) || cos[0] || null;
  function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(cos)); localStorage.setItem(LSCUR, (co()||{}).id || ''); }catch(_){} }
  function save(c){ lsSave(); if(db && c) db.doc('companies/'+c.id).set(clone(c)).catch(()=>{}); }
  const root = document.getElementById('company');
  const isoToday = () => { const t = new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };
  function render(){
    if(!root || root.hidden) return;
    root.innerHTML = uHead('🏭 কোম্পানি খতিয়ান', 'মাল আসা (চালান) ও টাকা দেওয়া (রসিদ)') + html(isoToday());
    bind();
  }
  function rerender(){ render(); }
  (async () => {
    db = await getDB(); if(!db) return;
    try{
      const snap = await db.collection('companies').get();
      const list = snap.docs.filter(s => s.exists).map(s => clone(s.data()));
      if(list.length){ cos = list.sort((a,b) => (a.created||0) - (b.created||0)); lsSave(); rerender(); }
      else cos.forEach(c => db.doc('companies/'+c.id).set(clone(c)).catch(()=>{}));
    }catch(_){}
  })();

  // oldest → newest, running ক্লোজিং = আগের জের + ডেবিট − ক্রেডিট
  function compute(c){
    const es = [...(c.entries||[])].sort((a,b) => a.date<b.date ? -1 : a.date>b.date ? 1 : (a.ts||0)-(b.ts||0));
    let bal = Number(c.opening)||0, tD = 0, tC = 0, kg = 0;
    const rows = es.map(e => {
      const d = e.type === 'inv' ? Number(e.amount)||0 : 0, cr = e.type === 'rec' ? Number(e.amount)||0 : 0;
      bal += d - cr; tD += d; tC += cr; if(e.type === 'inv') kg += Number(e.kg)||0;
      return {e, d, cr, bal};
    });
    return {rows, tD, tC, kg, bal};
  }
  const balTxt = b => b < 0 ? `<small>অগ্রিম</small>${bn(-b)}` : bn(b);

  const mm = n => toBn(Number(n) < 10 ? Number(n).toFixed(2) : n);
  function badge(){ const c = co(); if(!c) return 'কোম্পানি যোগ করুন'; const b = compute(c).bal; return (b < 0 ? 'অগ্রিম ' + bn(-b) : 'বাকি ' + bn(b)) + ' ৳'; }

  function html(dateIso){
    const c = co();
    if(!c || ui.adding) return `
        <div class="cy-new">
          <h3>${c ? 'নতুন কোম্পানি' : '🏭 কোম্পানি যোগ করুন'}</h3>
          <p class="cy-hint">যে কোম্পানি / মিল থেকে মাল আসে তার নাম লিখুন।</p>
          <input id="cyName" autocomplete="off" placeholder="কোম্পানির নাম">
          <div class="cy-acts"><button type="button" id="cyNameOk">সেভ করুন</button>${c ? '<button type="button" class="ghost" id="cyNameNo">বাতিল</button>' : ''}</div>
        </div>`;
    const k = compute(c);
    const ed = ui.editId ? (c.entries||[]).find(e => e.id === ui.editId) : null;
    const mode = ed ? ed.type : 'rec';
    const linked = !!(ed && ed.type === 'inv' && ed.fromStock);
    const v = (x, f) => (ed && ed[x] != null && ed[x] !== '' && ed[x] !== 0) ? (f ? bn(ed[x]) : esc(ed[x])) : '';
    return `
        <div class="cy-acct">
          <span class="cy-l">কোম্পানি</span>
          ${ui.renaming
            ? `<input id="cyRenIn" value="${esc(c.name)}" aria-label="কোম্পানির নাম"><button type="button" class="cy-ib ok" id="cyRenOk">✓</button>`
            : `<select id="cySel" aria-label="কোম্পানি">${cos.map(x => `<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="__new">＋ নতুন কোম্পানি</option></select>`}
          <button type="button" class="cy-ib" id="cyRen" aria-label="নাম বদলান">${ui.renaming ? '×' : '✎'}</button>
        </div>

        <div class="cy-top">
          <section class="cy-sum">
            <span class="lbl">${k.bal<0 ? 'অগ্রিম দেওয়া আছে' : 'মোট বাকি (কোম্পানি পাবে)'}</span>
            <b class="big ${k.bal<0?'adv':''}">${bn(Math.abs(k.bal))} ৳</b>
            <small class="words">${window.__inWords && k.bal ? 'কথায়: ' + window.__inWords(Math.abs(k.bal)) + ' টাকা মাত্র' : ''}</small>
            <div class="cy-mini">
              <span>মাল এসেছে<b>${bn(k.kg)} কেজি</b></span>
              <span>মোট চালান<b>${bn(k.tD)}</b></span>
              <span>মোট জমা<b>${bn(k.tC)}</b></span>
            </div>
          </section>
          <section class="cy-pay">
            <div class="cy-payhd"><h3>💵 টাকা জমা</h3>
              <input type="hidden" id="qDate" value="${dateIso}">
            </div>
            <label class="lbl" for="qAmt">টাকা</label>
            <input id="qAmt" class="num" inputmode="decimal" autocomplete="off">
            <div class="cy-q2 one">
              <label>রসিদ নং<input id="qVno" autocomplete="off" placeholder="ঐচ্ছিক"></label>
            </div>

  // used by স্টক → গাড়ি ডেলিভারি: one car = stock + a চালান (ডেবিট) on the company

    const kg = e.kg != null ? Number(e.kg) : (m ? num(m[1]) : 0), rate = m ? num(m[2]) : 0;
    if(e.mtype === 'soft' || e.mtype === 'hard') out[e.mtype] = {kg, rate};

    if($('renBtn')) $('renBtn').onclick = ()=>{ accMode='rename'; render(); $('accName').focus(); };

      const ok = await kDialog({icon:'🗑', tone:'warn', title:`"${esc(pnm(a))}" ডিলিট করবেন?`,
        html:`<p>${c.bal < 0 ? 'অগ্রিম' : 'বাকি'}: <b>${bn(Math.abs(c.bal))} ৳</b> · মেমো ${toBn(memos)}টা · টাকা জমা ${toBn(pays)}টা</p><p class="kd-note">এই পার্টির পুরো খতিয়ান মুছে যাবে — সব মেমো আর টাকা জমাসহ।${memos ? ' মেমোর মাল আবার স্টকে ফিরে যাবে।' : ''} পরে ফেরানো যাবে না।</p>`,
        ok:'হ্যাঁ, ডিলিট করুন', cancel:'না'});
      if(!ok) return;
      accs = accs.filter(x => x.id !== a.id); lsSave();

        const name = $('accName').value.trim(); if(!name){ $('accName').classList.add('bad'); return; }
        if(accMode==='new'){
          const a = {id:uid(), name, opening:0, openingNote:'', created:Date.now(), seq:0, entries:[]};
          accs.push(a); curId = a.id; save(a);
          try{localStorage.setItem(LSCUR,curId);}catch(_){}
        } else { const a = cur(); a.name = name; save(a); }
        accMode = null; render();
      };
      $('accSave').onclick = doSave;
      $('accName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doSave(); }});
      $('accCancel').onclick = ()=>{ accMode=null; render(); };

  // অবশিষ্ট = খরচ − জমা, filled in by itself until it is typed by hand
  function autoBaki(jEl, kEl, bEl){
    let own = false;
    const fill = () => { if(own || bEl.readOnly) return; const j = parseNum(jEl.value), k = parseNum(kEl.value); if(isNaN(j) && isNaN(k)) return; bEl.value = bn((isNaN(k)?0:k) - (isNaN(j)?0:j)); bEl.dispatchEvent(new Event('change')); };
    jEl.addEventListener('input', fill); kEl.addEventListener('input', fill);
    bEl.addEventListener('input', () => { own = bEl.value.trim() !== ''; });
  }
  // ＋ নতুন পার্টি: নাম → ঠিকানা → পুরনো খাতার জমা / খরচ / অবশিষ্ট (Enter goes to the next box)
  function openNewParty(ed){
    ed = ed && ed.id ? ed : null;   // ed = edit this party (✎ on আগের জের), else a new one
    const old = document.getElementById('npBg'); if(old) old.remove();
    const byAdded0 = [...accs].sort((x, y) => (x.created||0) - (y.created||0)), pos0 = ed ? byAdded0.indexOf(ed) + 1 : accs.length + 1;

    bg.innerHTML = `<div class="nz np" role="dialog" aria-modal="true" aria-labelledby="npT">

      </div>
      <div class="nppaid">

        <button type="button" class="paidbtn" id="npPaid" aria-pressed="${!!(ed && ed.oldPaid)}" title="পুরনো খাতার সব টাকা শোধ — বাকি ০">✓ Paid</button>
      </div>

      <p class="npsub">পুরনো খাতার জমা / খরচ <small>(না থাকলে খালি রাখুন)</small></p>

        <label>খরচ<input id="npKhoroch" class="num" inputmode="decimal" value="${ed ? v(ed.openKhoroch) : ''}"></label>
      </div>
      <p class="nzmsg" id="npMsg" role="status"></p>
      <div class="nzacts"><button type="button" class="ghost" id="npNo">বাতিল</button><button type="button" id="npOk">সেভ করুন</button></div>
    </div>`;
    document.body.appendChild(bg);
    const $ = id => document.getElementById(id);
    const onKey = e => { if(e.key === 'Escape') close(); };
    const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
    document.addEventListener('keydown', onKey);
    bg.addEventListener('click', e => { if(e.target === bg) close(); });
    $('npNo').onclick = close;
    if(typeof attachBanglish === 'function'){ attachBanglish($('npName')); attachBanglish($('npAddr')); }
    autoBaki($('npJoma'), $('npKhoroch'), $('npBaki'));
    $('npPaid').onclick = () => {   // ✓ Paid: old book fully paid → অবশিষ্ট ০
      const on = $('npPaid').getAttribute('aria-pressed') !== 'true', bk = $('npBaki');
      $('npPaid').setAttribute('aria-pressed', on);
      bk.value = on ? bn(0) : ''; bk.readOnly = on; bk.dispatchEvent(new Event('change'));
      $('npName').focus();
    };
    if(typeof attachWords === 'function') ['npBaki','npJoma','npKhoroch'].forEach(id => attachWords($(id)));   // কথায়: … টাকা মাত্র
    const msg = (t, el) => { $('npMsg').textContent = t; if(el) el.focus(); };
    const save1 = () => {
      const name = $('npName').value.trim(), addr = $('npAddr').value.trim();
      if(!name) return msg('পার্টির নাম লিখুন।', $('npName'));
      if(accs.some(a => a !== ed && a.name.trim() === name && (a.address||'').trim() === addr)) return msg('এই নামে পার্টি আগেই আছে।', $('npName'));
      const j = parseNum($('npJoma').value), k = parseNum($('npKhoroch').value), b = parseNum($('npBaki').value);
      // ক্রমিক নং: the next number puts it at the end; a smaller number puts it in that place (the ones after move down)
      const sl = parseNum($('npSl').value), byAdded = [...accs].filter(x => x !== ed).sort((x, y) => (x.created||0) - (y.created||0));
      let created = ed ? ed.created : Date.now();

        if(sl >= 1 && sl <= byAdded.length){
          const after = byAdded[sl - 1].created || 0, before = sl > 1 ? (byAdded[sl - 2].created || 0) : after - 2000;
          created = Math.floor((before + after) / 2);
        } else if(ed && byAdded.length) created = Math.max(Date.now(), (byAdded[byAdded.length - 1].created || 0) + 1000);
      }
      const a = ed || {id:uid(), seq:0, entries:[]};
      Object.assign(a, {name, opening:isNaN(b)?0:b, openingNote: ed && a.openingNote && !/^পুরনো খাতা/.test(a.openingNote) ? a.openingNote : '', created});
      if(addr) a.address = addr; else delete a.address;
      if(j > 0) a.openJoma = j; else delete a.openJoma;
      if(k > 0) a.openKhoroch = k; else delete a.openKhoroch;
      delete a.oldPaid;
      if(!a.openingNote && (j > 0 || k > 0 || b)) a.openingNote = 'পুরনো খাতা থেকে';
      if($('npPaid').getAttribute('aria-pressed') === 'true'){ a.opening = 0; a.oldPaid = true; a.openingNote = 'পুরনো খাতা — ✓ Paid'; }
      if(!ed) accs.push(a);
      accs.sort((x, y) => (x.created||0) - (y.created||0)); curId = a.id; save(a);
      try{ localStorage.setItem(LSCUR, curId); }catch(_){}
      close(); accMode = null; render();
    };
    $('npOk').onclick = save1;
    const next = {npName:'npBaki', npAddr:'npJoma', npJoma:'npKhoroch'};
    ['npName','npBaki','npAddr','npJoma','npKhoroch'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); if(next[id]) $(next[id]).focus(); else save1(); } }));

  function bindKh(){
    const $ = id => document.getElementById(id);
    const list = () => (kh[aDate] = kh[aDate] || []);
    const add = ()=>{
      const d = $('kDesc').value.trim(), v = parseNum($('kAmt').value), h = $('kHint');
      if(isNaN(v)||v<=0){ h.textContent='সঠিক টাকা লিখুন।'; h.className='hint err'; $('kAmt').focus(); return; }
      const row = {id:uid(), ts:Date.now(), desc:d, amt:v}; if(kMisc) row.misc = true;
      list().push(row); saveKh(aDate);
      kMsg = `✓ ${kMisc ? 'খুচরা ' : ''}খরচ যোগ হয়েছে: ${bn(v)} টাকা${d?' ('+d+')':''}`;
      kMisc = false;
      kAddOpen = false;
      renderAmdani();
      if(typeof kToast === 'function') kToast(`<b>✅ ${bn(v)} টাকা খরচ যোগ হয়েছে</b><span>${esc(d || 'খরচ')}</span>`);
    };
    $('kAdd').onclick = add;
    $('kDesc').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('kAmt').focus(); }});
    $('kAmt').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); }});
    document.querySelectorAll('#amdani .kedit').forEach(b=>b.onclick=()=>{ kEdit = b.dataset.k; kOpen = null; renderAmdani(); const x=$('keAmt'); if(x){ x.focus(); x.select(); } });
    if($('keSave')){
      const doS = ()=>{
        const x = list().find(i=>i.id===kEdit), v = parseNum($('keAmt').value);
        if(isNaN(v)||v<=0){ $('keAmt').classList.add('bad'); return; }
        x.amt = v; x.desc = $('keDesc').value.trim(); saveKh(aDate); kEdit = null; kMsg = '✓ সেভ হয়েছে'; renderAmdani();

  async function start(){
    db = await getDB();
    await load();
    await loadSabek();
    await loadKh();
    await loadRates();
    if(!accs.length){
      let seeded = false; try{ seeded = localStorage.getItem('kg-khata-ledger-seeded')==='1'; }catch(_){}
      if(!seeded && !db){ seed(); try{ localStorage.setItem('kg-khata-ledger-seeded','1'); }catch(_){} }   // never bring the sample party back once parties live online (they may have been deleted)
    }
    let saved = null; try{ saved = localStorage.getItem(LSCUR); }catch(_){}
    curId = accs.find(a=>a.id===saved) ? saved : (accs[0] && accs[0].id);
    render();
    if(window.__stock) window.__stock.render();
    if(window.__dashRender) window.__dashRender();
    if(window.__extrasInit) window.__extrasInit();
  }
  window.__amdaniRender = () => renderAmdani();
  window.__ledger = {
    accs: () => accs, kh: () => kh, compute, sabekInfo, dayTotal, khTotal,
    newDay: (oldD, newD) => { if(aDate === oldD) aDate = newD; render(); },
    saveAcc: a => save(a),
    // delete one memo / জমা from a party's খতিয়ান (its মাল goes back to স্টক by itself)
    deleteEntry: (aid, eid) => {
      const a = accs.find(x => x.id === aid); if(!a) return false;
      const n = (a.entries||[]).length;
      a.entries = (a.entries||[]).filter(x => x.id !== eid);
      if(a.entries.length === n) return false;
      save(a); render();
      if(window.__stock) window.__stock.render();
      if(window.__dashRender) window.__dashRender();
      return true;
    },
    newMemo: (aid) => {
      if(aid && accs.find(a=>a.id===aid)) curId = aid;
      if(!curId && accs[0]) curId = accs[0].id;
      lPrevDate = LD(); lDate = null;
      form = {mode:'sale', type:'credit', editId:null, preParty: aid || ''};
      render();
    },
    // every goods memo includes labour by default: add it to any that were saved without it
    applyLabourAll: () => {
      const changed = new Set();
      accs.forEach(a => (a.entries||[]).forEach(e => {
        const kg = entryKg(e);
        if(!(Number(e.credit) > 0) || !(kg > 0) || e.labour != null || e.labourOff) return;
        const goods = e.goods != null ? Number(e.goods) : Number(e.credit);
        const lr = window.__labourRate ? window.__labourRate() : 200;
        const raw = Math.round(kg * lr / 1000 * 100) / 100;
        const total = Math.round((goods + raw) / 10) * 10;
        const labour = Math.round((total - goods) * 100) / 100;
        Object.assign(e, {goods, labourRaw: raw, labour, roundAdj: Math.round((labour - raw) * 100) / 100, labourRate: lr, credit: total});
        changed.add(a);
      }));
      if(changed.size){ changed.forEach(a => save(a)); render(); }
    },
    applyLabour: (aid, eid) => {
      const a = accs.find(x=>x.id===aid); if(!a) return; const e = (a.entries||[]).find(x=>x.id===eid); if(!e) return;
      const kg = entryKg(e); if(!(kg > 0)) return;
      const goods = e.goods != null ? Number(e.goods) : Number(e.credit);
      const lr = window.__labourRate ? window.__labourRate() : 200;
      const raw = Math.round(kg * lr / 1000 * 100) / 100;
      const total = Math.round((goods + raw) / 10) * 10;
      const labour = Math.round((total - goods) * 100) / 100;
      Object.assign(e, {goods, labourRaw: raw, labour, roundAdj: Math.round((labour - raw) * 100) / 100, labourRate: lr, credit: total});
      save(a); render();
    },
    rates: () => rates,
    // a waiting memo (stock was short) is sent by itself as soon as there is enough stock; oldest first
    autoSend: (quiet) => {
      if(!window.__shortage) return [];
      const waiting = [];
      accs.forEach(a => (a.entries||[]).forEach(e => { if(entryKg(e) > 0 && e.status !== 'confirmed') waiting.push({a, e}); }));
      waiting.sort((x, y) => (x.e.date < y.e.date ? -1 : x.e.date > y.e.date ? 1 : (x.e.memoNo||0) - (y.e.memoNo||0)));
      const sent = [], changed = new Set();
      waiting.forEach(({a, e}) => {
        const ok = !Array.isArray(e.picks) || !e.picks.length || !window.__shortage(e.picks, {}).length;
        if(ok){ e.status = 'confirmed'; e.confirmedOn = (Array.isArray(e.picks) && e.picks.length) ? isoOfL(new Date()) : e.date; sent.push({a, e}); changed.add(a); }
      });
      changed.forEach(a => save(a));
      if(sent.length){
        render();
        if(window.__extrasRefresh) window.__extrasRefresh();
        if(!quiet && typeof kToast === 'function') kToast(`<b>🚚 স্টকে মাল এসেছে — অপেক্ষার মেমোর মাল পাঠানো হলো</b><span>${sent.map(x => 'মেমো #' + toBn(x.e.memoNo||'') + ' · ' + esc(x.a.name)).join(' , ')}</span>`, 6000);
      }
      return sent;
    },
    edit: (aid, eid) => {
      const a = accs.find(x=>x.id===aid); if(!a) return; const e = (a.entries||[]).find(x=>x.id===eid); if(!e) return;
      curId = aid; try{ localStorage.setItem(LSCUR, aid); }catch(_){}
      if(form.mode!=='edit') lPrevDate = LD(); lDate = e.date;
      if(Number(e.credit) > 0 && entryKg(e) > 0){
        // মাল বিক্রির মেমো: same পাকা মেমো form as নতুন মেমো (মালের ধরন → মার্কা → সাইজ), pre-filled
        form = {mode:'sale', type:'credit', editId:e.id, preParty:aid};
        render(); return;
      }
      form = {mode:'edit', type: e.credit?'credit':'debit', editId:e.id};
      const onLedger = !document.getElementById('ledger').hidden;
      if(onLedger) keepY = window.scrollY;
      render(); if(!onLedger && window.showTab) window.showTab('ledger');
    },
    setStatus: (aid, eid, st, on) => {
      const a = accs.find(x=>x.id===aid); if(!a) return; const e = (a.entries||[]).find(x=>x.id===eid); if(!e) return;
      e.status = st; if(st==='confirmed') e.confirmedOn = on || isoOfL(new Date()); else delete e.confirmedOn;
      save(a); render();
      if(window.__extrasRefresh) window.__extrasRefresh();     // লেবার / মেমো lists update right away
      if(window.__stock) window.__stock.render();
    },
    open: id => { curId = id; try{localStorage.setItem(LSCUR,id);}catch(_){}; form = {mode:'new', type:'credit', editId:null}; render(); if(window.showTab) window.showTab('ledger'); }
  };
  start();
})();


// live comma formatting (Indian style, Bangla digits) for every number box
document.addEventListener('input', e=>{
  const el = e.target;
  if(!(el instanceof HTMLInputElement) || el.getAttribute('inputmode')!=='decimal') return;
  const BD='০১২৩৪৫৬৭৮৯';
  if(el.hasAttribute('data-plain')){
    const o = el.value.replace(/[0-9]/g, d=>BD[d]);
    if(o !== el.value){ const c = el.selectionStart; el.value = o; try{ el.setSelectionRange(c,c); }catch(_){} }
    return;
  }
  const raw = el.value;
  const caret = el.selectionStart==null ? raw.length : el.selectionStart;
  const keep = ch => /[0-9০-৯.]/.test(ch);
  const before = [...raw.slice(0,caret)].filter(keep).length;   // digits left of cursor
  let en = raw.replace(/[০-৯]/g, d=>BD.indexOf(d)).replace(/[^0-9.]/g,'');
  const dot = en.indexOf('.');
  if(dot>-1) en = en.slice(0,dot+1) + en.slice(dot+1).replace(/\./g,'');
  let [ip, dp] = en.split('.');
  ip = ip.replace(/^0+(?=\d)/,'');
  let grouped = ip;
  if(ip.length>3){ const last3 = ip.slice(-3), rest = ip.slice(0,-3); grouped = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3; }
  const out = (grouped + (dp!==undefined ? '.'+dp : '')).replace(/[0-9]/g, d=>BD[d]);
  if(out===raw) return;
  el.value = out;
  let n=0, pos=out.length;
  if(before===0) pos=0; else for(let i=0;i<out.length;i++){ if(keep(out[i])) n++; if(n===before){ pos=i+1; break; } }
  try{ el.setSelectionRange(pos,pos); }catch(_){}
});

(function(){

    const t = today();

    const payers = {};

    const topPay = Object.entries(payers).map(([id,v])=>({a:accs.find(a=>a.id===id), v})).filter(x=>x.a).sort((x,y)=>y.v-x.v).slice(0,5);

    const empty = buckets.every(b=>!b.inc && !b.exp);
    return `<div class="chartwrap">${empty?`<p class="dnone">এই সময়ে কোনো আমদানি বা খরচ নেই।</p>`:''}
      <svg viewBox="0 0 ${W} ${H+24}" width="${W}" height="${H+24}" role="img" aria-label="দিনভিত্তিক আমদানি ও খরচ">

  }

        <div class="dt"><span class="k">স্টক (সর্বশেষ)</span><span class="v">${bn(D.stockNow)}</span><span class="s">কেজি</span></div>
        <div class="dt blue"><span class="k">অগ্রিম জমা</span><span class="v">${bn(D.adv)}</span><span class="s">মোট ${bn(D.parties)} পার্টি</span></div>

(function(){

  const longD = id => { const d = dOf(id); return BN_W[d.getDay()]+', '+nice(id); };
  const shortD = id => { const [y,m,d] = id.split('-'); return toBn(d+'/'+m+'/'+y.slice(2)); };
  const L = () => window.__ledger;

  /* ---------- shared period picker ---------- */
  function rangeOf(st){

    if(st.p==='all')   return ['0000-01-01','9999-12-31'];
    const f = st.f || shift(t,-29), to = st.t || t;

      const cuts = [...node.querySelectorAll('.lp-head, .lp-row, .lp-total, tr, .cm-foot, .cm-words, .cm-quote')]
        .map(el => Math.round((el.getBoundingClientRect().bottom - nodeTop) * SCALE)).sort((p,q)=>p-q);
      const canvas = await window.html2canvas(node, {scale:SCALE, backgroundColor:'#ffffff', useCORS:true});
      holder.remove();
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({unit:'pt', format:'a4'});
      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      const margin = 18;
      if(fitOne){
        // a memo always goes on ONE page: shrink to fit if needed
        const s = Math.min((pw - 2*margin) / canvas.width, (ph - 2*margin) / canvas.height);
        const w = canvas.width * s, h = canvas.height * s;
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (pw - w)/2, margin, w, h);
      } else {
        // long lists: split into pages only between rows
        const s = (pw - 2*margin) / canvas.width;
        const pagePx = Math.floor((ph - 2*margin) / s);
        let y = 0, i = 0;
        while(y < canvas.height - 2){
          let end = Math.min(y + pagePx, canvas.height);
          if(end < canvas.height){ const ok = cuts.filter(c => c > y + 40 && c <= end); if(ok.length) end = ok[ok.length-1]; }
          const part = document.createElement('canvas');
          part.width = canvas.width; part.height = end - y;
          const g = part.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,part.width,part.height);
          g.drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
          if(i) pdf.addPage();
          pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, pw - 2*margin, (end - y) * s);
          y = end; i++;
        }
      }
      const blob = pdf.output('blob');
      const dl = await getDL();

        try{ await dl.save({filename, data: blob}); say('✓ সেভ হয়েছে'); }

      }

  function labourData(){
    const [f,t] = rangeOf(lst);

    const gone = x => x.e.confirmedOn || x.e.date;
    const lines = allLines().filter(x => kgOf(x.e) > 0 && x.e.status === 'confirmed' && gone(x)>=f && gone(x)<=t)

      </section>
      <div class="bk-tools">

        <div class="bk-chips" role="group" aria-label="কারা দেখাবে">
          ${[['due','বাকি আছে'],['adv','অগ্রিম'],['all','সব পার্টি']].map(([k,l]) => `<button type="button" data-f="${k}" aria-pressed="${view.f===k}">${l}</button>`).join('')}

/* after 12 at night the next date opens by itself (checked every 30 s and when the phone wakes up) */
(function(){
  const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let lastDay = iso(new Date());
  const check = () => {
    const now = iso(new Date());
    if(now === lastDay) return;
    const old = lastDay; lastDay = now;
    if(window.__stock) window.__stock.rollover();
    if(window.__ledger) window.__ledger.newDay(old, now);
    const ct = document.getElementById('calTab');
    if(ct && window.calSvg) ct.innerHTML = calSvg(String(new Date().getDate()).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]));
    if(window.__dashRender) window.__dashRender();
  };
  setInterval(check, 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
  window.addEventListener('focus', check);
})();

  // খতিয়ান on a computer: the table's column names sit exactly under the fixed date bar
  const fitLd = () => { const d = document.querySelector('#ledger:not([hidden]) > .ldate'); if(d) document.documentElement.style.setProperty('--ldH', (isWide() ? d.offsetHeight : 0) + 'px'); };
  window.addEventListener('scroll', fitLd, {passive:true}); window.addEventListener('resize', fitLd); setTimeout(fitLd, 300);
  let wideNow = isWide();
  window.addEventListener('resize', () => {
    const w = isWide(); if(w === wideNow) return; wideNow = w; applyTheme();
    ['__memoRender','__labourRender','__amdaniRender','__settingsRender','__dashRender'].forEach(f => { if(window[f]) window[f](); });
  });
  const ct = document.getElementById('calTab');
  if(ct) ct.innerHTML = calSvg(String(new Date().getDate()).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]));
  // phones: tabs on top (sticky things sit under them); computer: tabs are a side menu, so nothing to offset
  const setTabsH = () => { const t = document.querySelector('.tabs'); if(t) document.documentElement.style.setProperty('--tabsH', (window.innerWidth >= 900 ? 0 : t.getBoundingClientRect().height) + 'px'); };
  setTabsH(); window.addEventListener('resize', setTabsH);
  tabs.forEach(t=>t.onclick=()=>show(t.dataset.tab));
  let last = 'stock'; try{ last = localStorage.getItem('kg-khata-tab') || 'stock'; }catch(_){}
  show(last);
})();

</script>
</body>
