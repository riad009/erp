<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>স্টক, খতিয়ান ও আমদানি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&family=Atma:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBFD; --rule:#D9E3F0; --margin:#E8A3AE;
  --ink:#1D2A44; --muted:#66728A; --blue:#1F3A93;
  --red:#C3122F; --red-soft:#FBE7EA; --field:#FFFFFF; --line:#C9D3E2;
  --btn-text:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A2A; --rule:#22304A; --margin:#6E2A36;
    --ink:#E6EAF3; --muted:#9AA6BE; --blue:#8FB0FF;
    --red:#FF5A6E; --red-soft:#3A1A22; --field:#1A2236; --line:#2E3B57;
    --btn-text:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A2A; --rule:#22304A; --margin:#6E2A36;
  --ink:#E6EAF3; --muted:#9AA6BE; --blue:#8FB0FF;
  --red:#FF5A6E; --red-soft:#3A1A22; --field:#1A2236; --line:#2E3B57;
  --btn-text:#FFFFFF; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans Bengali","Hind Siliguri","Noto Sans Bengali","Vrinda",system-ui,sans-serif;
  font-size:17px; line-height:1.55;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);
}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 60px 34px;position:relative;min-height:100vh}
.wrap::before{content:"";position:absolute;top:0;bottom:0;left:22px;width:2px;background:var(--margin);opacity:.7}
.num{font-family:"Baloo Da 2","Noto Sans Bengali","Hind Siliguri",sans-serif;font-variant-numeric:tabular-nums}
header{margin-bottom:14px}
header .book{color:var(--muted);font-size:15px;margin:0}
header h1{margin:2px 0 0;font-size:28px;line-height:1.25;color:var(--blue);font-weight:700}
header .status{font-size:14px;color:var(--muted)}

.calc{margin:10px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.row .lbl{color:var(--muted);font-size:16px}
.row .val{font-size:22px;color:var(--ink);font-weight:600;text-align:right}
.row input{width:170px;text-align:right;font-size:20px}
.minus .val, .minus input{color:var(--red)}
.rule-red{height:2px;background:var(--red);margin:4px 0 2px;border-radius:2px}

input{
  font:inherit;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;
}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
button{font:inherit;cursor:pointer;border-radius:10px;border:0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.add{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin:18px 0 6px;align-items:end}
.add label{display:block;font-size:14px;color:var(--muted);margin-bottom:3px}
.add input{width:100%;font-size:19px}
.add button{background:var(--blue);color:var(--btn-text);padding:11px 16px;font-weight:600;height:48px}
.hint{font-size:13px;color:var(--muted);margin:0 0 6px;min-height:1.2em}
.hint.err{color:var(--red)}

ol.entries{list-style:none;margin:8px 0 0;padding:0}
ol.entries li{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
ol.entries .kg{flex:1;font-size:21px;color:var(--red);font-weight:600}
ol.entries .car{font-size:17px;color:var(--ink);background:var(--red-soft);padding:2px 10px;border-radius:6px;white-space:nowrap}
ol.entries .del{background:transparent;color:var(--muted);font-size:20px;width:36px;height:36px;line-height:1}
ol.entries .del:hover{color:var(--red)}
ol.entries .del.armed{width:auto;padding:0 12px;background:var(--red);color:var(--btn-text);font-size:15px;font-weight:600}
.close-btn.armed{background:var(--blue);font-size:16px}
.empty{color:var(--muted);font-size:15px;padding:8px 0}

.grand{margin-top:14px;padding-top:6px;border-top:2px solid var(--red)}
.grand .total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.grand .total .lbl{font-size:18px;font-weight:600}
.grand .total .val{font-size:clamp(30px,9vw,42px);color:var(--red);font-weight:800;line-height:1.1}

.close-btn{display:block;width:100%;margin-top:22px;padding:14px;background:var(--red);color:var(--btn-text);font-size:18px;font-weight:600}
.link-btn{background:transparent;color:var(--muted);text-decoration:underline;padding:8px 0;font-size:14px;margin-top:6px}

section.history{margin-top:38px}
section.history h2{font-size:20px;color:var(--blue);margin:0 0 6px}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary .d{font-weight:600}
summary .t{color:var(--red);font-weight:700}
details .mini{font-size:15px;color:var(--muted);padding:4px 0 6px 6px}
details .mini div{display:flex;justify-content:space-between;gap:10px}
.loading{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .flash{animation:flash .6s ease-out}
  @keyframes flash{from{background:var(--red-soft)}to{background:transparent}}
}
@media (max-width:420px){
  .add{grid-template-columns:1fr 1fr}
  .add button{grid-column:1 / -1}
  .row input{width:150px}
}

.datebar{display:flex;align-items:center;gap:8px}
.datebar h1{flex:1}
.navbtn{background:var(--field);color:var(--blue);border:1.5px solid var(--line);width:40px;height:40px;font-size:24px;line-height:1;flex:none}
.navbtn:disabled{opacity:.35;cursor:default}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.pick{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--btn-text);padding:7px 14px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.warn{font-size:14px;color:var(--red);background:var(--red-soft);padding:6px 10px;border-radius:8px;margin:8px 0 0}
ol.entries .edit{background:transparent;color:var(--blue);font-size:18px;width:36px;height:36px}
ol.entries li.editing{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;padding:10px 0}
ol.entries li.editing input{width:100%;font-size:18px}
ol.entries li.editing .acts{grid-column:1 / -1;display:flex;gap:8px}
ol.entries li.editing .acts button{flex:1;padding:10px;font-weight:600}
.save{background:var(--blue);color:var(--btn-text)}
.cancel{background:var(--field);color:var(--ink);border:1.5px solid var(--line)!important}
input.bad{border-color:var(--red)}
.hist{display:flex;justify-content:space-between;gap:10px;width:100%;background:transparent;color:var(--ink);padding:10px 2px;border-bottom:1px solid var(--line);border-radius:0;text-align:left}
.hist .t{color:var(--red);font-weight:700}
.hist.cur .d::after{content:"  (চলতি)";color:var(--muted);font-weight:400;font-size:14px}
.nodata{padding:20px 0}
.nodata button{background:var(--blue);color:var(--btn-text);padding:12px 18px;font-weight:600;margin-top:8px}
.second{display:block;width:100%;margin-top:22px;padding:14px;background:var(--field);color:var(--blue);border:1.5px solid var(--line);font-size:17px;font-weight:600}
/* ---------- tabs ---------- */
:root{--lpaper:#BDE4F0;--lcard:#D5EEF6;--lline:#4F86C6;--lhead:#1B4D9B;--lfield:#F2FAFD}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lpaper:#0D2230;--lcard:#12303F;--lline:#2F6390;--lhead:#8EC2FF;--lfield:#0F2735}}
:root[data-theme="dark"]{--lpaper:#0D2230;--lcard:#12303F;--lline:#2F6390;--lhead:#8EC2FF;--lfield:#0F2735}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:6px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px;font-weight:700;font-size:16px;background:var(--field);color:var(--ink);border:1.5px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--blue);color:var(--btn-text);border-color:var(--blue)}
body.on-ledger{background:var(--lpaper);background-image:none}
body.on-ledger .tabs{background:var(--lpaper);border-color:var(--lline)}
body.on-ledger .tabs button[aria-selected="true"]{background:var(--lhead);border-color:var(--lhead);color:var(--lpaper)}
[hidden]{display:none!important}

/* ---------- ledger ---------- */
.lwrap{max-width:640px;margin:0 auto;padding:16px 14px 70px;color:var(--ink)}
.ltitle{text-align:center;margin:4px 0 14px}
.ltitle span{display:inline-block;border:2px solid var(--lhead);color:var(--lhead);border-radius:14px;padding:4px 18px;font-weight:700;font-size:22px;letter-spacing:.5px}
.acct{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--lline);padding-bottom:10px;margin-bottom:12px}
.acct .lab{color:var(--lhead);font-weight:700;line-height:1.1;font-size:15px;flex:none}
.acct .lab small{display:block;font-weight:500;font-size:11px}
.acct select{flex:1;min-width:0;font:inherit;font-size:19px;font-weight:600;color:var(--ink);background:var(--lfield);border:1.5px solid var(--lline);border-radius:10px;padding:8px 10px}
.lbtn{background:var(--lfield);color:var(--lhead);border:1.5px solid var(--lline);padding:8px 12px;font-weight:600;flex:none}
.lbtn.solid{background:var(--lhead);color:var(--lpaper);border-color:var(--lhead)}
.lwrap input{background:var(--lfield);border-color:var(--lline)}
.accform{display:flex;gap:8px;margin:-2px 0 12px}
.accform input{flex:1;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--lcard);border:1.5px solid var(--lline);border-radius:12px;padding:8px 12px}
.tile .k{font-size:13px;color:var(--lhead);font-weight:600}
.tile .v{font-size:20px;font-weight:700}
.tile.big{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile.big .v{font-size:clamp(28px,8vw,38px);color:var(--red);font-weight:800;line-height:1.1}
.lform{background:var(--lcard);border:2px solid var(--lline);border-radius:14px;padding:12px;margin-bottom:16px}
.lform.editing{border-color:var(--red)}
.lform .ft{font-weight:700;color:var(--lhead);margin:0 0 8px}
.lform.editing .ft{color:var(--red)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{padding:10px 6px;background:var(--lfield);color:var(--ink);border:1.5px solid var(--lline);font-weight:600;line-height:1.25}
.seg button small{display:block;font-weight:400;font-size:12px;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--lhead);color:var(--lpaper);border-color:var(--lhead)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.lform label{display:block;font-size:13px;color:var(--lhead);font-weight:600}
.lform label input{width:100%;margin-top:3px;font-size:18px}
.lform .full{margin-bottom:10px}
.lacts{display:flex;gap:8px;flex-wrap:wrap}
.lacts button{flex:1;padding:12px;font-weight:700;font-size:16px}
.lacts .del2{flex:0 0 auto;background:transparent;color:var(--red);border:1.5px solid var(--red)}
.lacts .del2.armed{background:var(--red);color:var(--btn-text)}
.lhint{font-size:13px;color:var(--muted);margin:6px 0 0;min-height:1.1em}
.lhint.err{color:var(--red)}
.tw{overflow-x:auto;border:2px solid var(--lline);border-radius:12px;background:var(--lcard)}
table.lt{border-collapse:collapse;width:100%;min-width:350px}
.lt th{color:var(--lhead);font-weight:700;font-size:15px;padding:8px 6px;border-bottom:2px solid var(--lline);border-right:1px solid var(--lline);text-align:center;line-height:1.15;vertical-align:bottom}
.lt th small{display:block;font-weight:500;font-size:11px;opacity:.85}
.lt td{padding:7px 7px;border-right:1px solid var(--lline);border-bottom:1px solid color-mix(in srgb,var(--lline) 45%,transparent);vertical-align:top;font-size:15px}
.lt th:last-child,.lt td:last-child{border-right:0}
.lt td.dt b{display:block;font-family:"Baloo Da 2","Noto Sans Bengali","Hind Siliguri",sans-serif;font-weight:700;white-space:nowrap}
.lt td.dt small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.lt td.n{text-align:right;white-space:nowrap;font-family:"Baloo Da 2","Noto Sans Bengali","Hind Siliguri",sans-serif;font-weight:600}
.lt td.bal{color:var(--red);font-weight:700}
.lt tr.r{cursor:pointer}
.lt tr.r:hover td,.lt tr.r.sel td{background:color-mix(in srgb,var(--lhead) 12%,transparent)}
.lt tr.open td{font-style:normal;background:color-mix(in srgb,var(--lline) 10%,transparent)}
.lt tfoot td{border-top:2px solid var(--lline);font-weight:700}
.tnote{font-size:13px;color:var(--muted);margin:8px 2px 0}
.lempty{padding:18px 0;color:var(--muted)}
.amd{grid-template-columns:1fr}
.amd .full2{grid-column:1 / -1}
.amd button{grid-column:1 / -1}
.amdlist li{gap:8px}
.amdlist .no{color:var(--muted);font-size:17px;min-width:1.6em}
.amdlist .kg{flex:0 0 auto;min-width:6.5em}
.amdlist .pname{flex:1;text-align:left;background:transparent;color:var(--ink);font-size:17px;padding:4px 0;line-height:1.3;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.amdlist .pname small{display:block;font-size:13px;color:var(--muted);text-decoration:none}
.combo{position:relative}
.combo input{width:100%;padding-right:48px}
.combo-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;background:transparent;color:var(--blue);font-size:20px}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;list-style:none;margin:0;padding:4px;background:var(--field);border:1.5px solid var(--blue);border-radius:12px;max-height:280px;overflow-y:auto;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.combo-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;cursor:pointer}
.combo-list li+li{border-top:1px solid var(--line)}
.combo-list li.opt:hover,.combo-list li.opt:active{background:color-mix(in srgb,var(--blue) 14%,transparent)}
.combo-list .on{font-weight:600;font-size:17px}
.combo-list .ob{font-size:14px;color:var(--red);white-space:nowrap}
.combo-list .ob.adv{color:var(--blue)}
.combo-list .addnew{color:var(--blue);font-weight:700;justify-content:flex-start}
.combo-list .none{color:var(--muted);font-size:14px;cursor:default}
.newparty{margin-top:10px;padding:12px;border:2px solid var(--blue);border-radius:12px;background:var(--field)}
.newparty label{font-weight:600;color:var(--blue)}
.np-row{display:flex;gap:8px;margin-top:6px}
.np-row input{flex:1;min-width:0;font-size:18px}
.np-row .lbtn{padding:8px 14px}
#amdani .lbtn{background:var(--paper);color:var(--blue);border:1.5px solid var(--line)}
#amdani .lbtn.solid{background:var(--blue);color:var(--btn-text);border-color:var(--blue)}
.sabek{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.sabek .lbl{font-size:19px;font-weight:700}
.sabek .val{font-size:24px;font-weight:700;color:var(--blue);flex:1}
.sabek input{flex:1;min-width:140px;font-size:20px}
.sabek .sedit{background:transparent;color:var(--blue);font-size:18px;width:36px;height:36px}
#amdani .sabek .lbtn{padding:8px 14px}
.sabek-sub{margin:0 0 6px;font-size:13px;color:var(--muted)}
.linkish{background:transparent;color:var(--blue);text-decoration:underline;padding:0;font-size:13px}
h2.nogod{font-size:20px;margin:14px 0 2px;color:var(--ink)}
.amdlist .amt{flex:0 0 auto;min-width:7.2em;font-size:20px;font-weight:600;color:var(--ink)}
.addlbl{margin:18px 0 -10px;font-weight:600;color:var(--blue);font-size:15px}

/* ---- আমদানি clean layout ---- */
#amdani .ahead{margin-bottom:10px}
#amdani .ahead h1{font-size:24px}
.asum{background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px 10px;margin-bottom:16px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow .k{color:var(--muted);font-size:16px}
.srow .v{font-size:20px;font-weight:700;color:var(--ink)}
.srow.plus .v{color:var(--blue)}
.srow.grand2{border-bottom:0;border-top:2px solid var(--red);margin-top:2px}
.srow.grand2 .k{color:var(--ink);font-weight:700;font-size:18px}
.srow.grand2 .v{color:var(--red);font-size:clamp(26px,7.5vw,34px);font-weight:800}
.sval{background:transparent;padding:0;display:inline-flex;align-items:center;gap:6px}
.sval .pen{font-size:14px;color:var(--blue);font-weight:400}
.sedit-box{display:flex;gap:6px;flex:1;justify-content:flex-end}
.sedit-box input{width:150px;font-size:18px;text-align:right}
#amdani .sedit-box .lbtn{padding:6px 12px}
.ssub{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.acard{background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.acard h2{font-size:19px;margin:0;color:var(--ink)}
.acard-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--line);padding-bottom:6px}
.acard-h .cnt{color:var(--muted);font-size:14px}
.alist{list-style:none;margin:0;padding:0}
.alist li{border-bottom:1px dashed var(--line)}
.alist li:last-child{border-bottom:0}
.arow{display:grid;grid-template-columns:2.2em auto 1fr 1.2em;align-items:center;gap:10px;width:100%;background:transparent;color:var(--ink);padding:11px 0;text-align:left;border-radius:0}
.arow .no{color:var(--muted);font-size:16px}
.arow .amt{font-size:20px;font-weight:700;white-space:nowrap}
.arow .nm{font-size:17px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .chev{color:var(--muted);font-size:13px;text-align:right}
.alist li.open{background:color-mix(in srgb,var(--blue) 8%,transparent);margin:0 -14px;padding:0 14px}
.racts{display:flex;gap:6px;padding:0 0 10px}
.racts button{flex:1;padding:9px 6px;font-size:14px;font-weight:600;background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.racts .del{color:var(--red);border-color:var(--red)}
.racts .del.armed{background:var(--red);color:var(--btn-text)}
.aedit{display:grid;grid-template-columns:2.2em 1fr;gap:8px;padding:10px 0;align-items:center}
.aedit .no{color:var(--muted)}
.aedit input{grid-column:1 / -1;font-size:20px;width:100%}
.aedit .acts{grid-column:1 / -1;display:flex;gap:8px}
.aedit .acts button{flex:1;padding:10px;font-weight:600}
.aempty{padding:14px 0;color:var(--muted);font-size:15px}
.addcard h2{margin-bottom:8px;color:var(--blue)}
.fl{display:block;font-size:14px;color:var(--muted);margin:6px 0 3px}
.amtrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:4px}
.amtrow input{width:100%;font-size:20px}
.amtrow button{background:var(--blue);color:var(--btn-text);padding:0 18px;height:48px;font-weight:700}
.addcard .hint:empty{display:none}
.addcard .hint{margin:8px 0 0}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:4px 0 14px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field)}
.subtabs .st{padding:11px 6px;background:transparent;color:var(--muted);font-weight:700;font-size:17px;border-radius:0;line-height:1.25}
.subtabs .st span{display:block;font-size:13px;font-weight:600}
.subtabs .st[aria-selected="true"]{background:var(--blue);color:var(--btn-text)}
.subtabs .st.kh[aria-selected="true"]{background:var(--red);color:var(--btn-text)}
.srow.minus2 .v{color:var(--red)}
.kcard h2{color:var(--red)!important}
.kcard > input{width:100%;font-size:18px}
#kAdd{background:var(--red)!important}
.dpick{position:relative;flex:1;min-width:0;cursor:pointer;display:block}
.dpick h1{margin:0}
.dpick .dcal{font-size:.6em;vertical-align:middle;opacity:.85}
.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.addtoggle{display:block;width:100%;padding:13px;font-size:18px;font-weight:700;background:var(--paper);color:var(--blue);border:1.5px solid var(--line);border-radius:10px;margin-bottom:6px}
.addcard.collapsed{padding:0;border:0;background:transparent}
.addcard.collapsed > :not(.addtoggle){display:none!important}
.addcard.collapsed .addtoggle{background:var(--blue);color:var(--btn-text);border-color:var(--blue);margin:0}
.kcard.collapsed .addtoggle{background:var(--red);border-color:var(--red)}
.kcard .addtoggle{color:var(--red)}
#amdani .addcard,#amdani .combo,#amdani .amtrow input,#amdani #kDesc{scroll-margin-top:84px}
.combo-list{max-height:min(280px,36vh)!important}
#amdani{padding-bottom:45vh}
.arow2{display:grid;grid-template-columns:2em auto 1fr 38px 38px;align-items:center;gap:6px;padding:9px 0}
.arow2 .no{color:var(--muted);font-size:16px}
.arow2 .amt{font-size:19px;font-weight:700;white-space:nowrap;color:var(--ink)}
.arow2 .nm{font-size:16.5px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;color:var(--ink);padding:0;min-width:0}
.arow2 .ic{width:38px;height:38px;border-radius:9px;background:var(--paper);border:1.5px solid var(--line);color:var(--blue);font-size:17px;padding:0;line-height:1}
.arow2 .ic.del,.arow2 .ic.kdel{color:var(--red)}
.arow2 .ic.armed{width:auto;min-width:38px;padding:0 6px;font-size:12px;background:var(--red);color:var(--btn-text);border-color:var(--red)}
.arow2:has(.ic.armed){grid-template-columns:2em auto 1fr 38px auto}
.aedit2{padding:10px 12px 12px;margin:6px -6px;border:2px solid var(--blue);border-radius:12px;background:var(--paper)}
.aedit2 .eh{font-weight:700;color:var(--blue);margin-bottom:2px}
.aedit2 input,.aedit2 select{width:100%;font-size:18px}
.aedit2 select{font:inherit;font-size:18px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;flex:1;min-width:0}
.aedit2 .np-row input{flex:1}
#amdani .aedit2 .lbtn{white-space:nowrap}
.aedit2 .acts{display:flex;gap:8px;margin-top:10px}
.aedit2 .acts button{flex:1;padding:11px;font-weight:700}
.lmsg{margin:8px 0 0;font-size:14px;color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent);padding:6px 10px;border-radius:8px}
.ldate{margin:0 0 2px}
.ldate h1{font-size:22px;color:var(--lhead)}
.ldate .navbtn{background:var(--lfield);color:var(--lhead);border-color:var(--lline)}
.ldnote{margin:0 0 12px;font-size:13px;color:var(--muted)}
.lform .full input{width:100%}

/* =========== খতিয়ান: pen-and-paper ledger book look =========== */
:root{--pp:#C3E5F1;--ppl:#86B6DA;--pr:#1D4C9C;--pk:#16224F;--pred:#B3122B;--pmut:#46688C;
  --hand:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;--print:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pp:#A9D2E2;--ppl:#6F9FC6}}
:root[data-theme="dark"]{--pp:#A9D2E2;--ppl:#6F9FC6}
body.on-ledger{background-color:var(--pp);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--ppl) 35px,var(--ppl) 36px)}
body.on-ledger .tabs{background:var(--pp);border-color:var(--ppl)}
body.on-ledger .tabs button{background:rgba(255,255,255,.35);color:var(--pr);border-color:var(--ppl)}
body.on-ledger .tabs button[aria-selected="true"]{background:var(--pr);color:#fff;border-color:var(--pr)}
#ledger{color-scheme:light;color:var(--pk);position:relative;padding-left:26px}
#ledger::before{content:"";position:absolute;top:0;bottom:0;left:12px;width:6px;border-left:1.5px solid #D86A7C;border-right:1.5px solid #D86A7C;opacity:.75}

/* printed parts */
#ledger .ltitle span{font-family:var(--print);color:var(--pr);border-color:var(--pr);background:rgba(255,255,255,.35);font-size:22px}
#ledger .acct .lab,#ledger .lform label,#ledger .lform .ft,#ledger .lt th,#ledger .tile .k,#ledger .tnote,#ledger .ldnote{font-family:var(--print)}
#ledger .acct .lab,#ledger .lt th,#ledger .lform label{color:var(--pr)}
#ledger .ldnote,#ledger .tnote,#ledger .lhint{color:var(--pmut)}

/* handwriting (ink) */
#ledger .ldate h1{font-family:var(--hand);font-weight:600;color:var(--pk);font-size:24px}
#ledger .ldate .dcal{filter:grayscale(1);opacity:.6}
#ledger .navbtn{background:transparent;border:1.5px solid var(--pr);color:var(--pr)}
#ledger .acct{border-bottom:2px solid var(--pr)}
#ledger .acct select{font-family:var(--hand);font-size:26px;font-weight:600;color:var(--pk);background:transparent;border:0;border-bottom:2px dotted var(--pr);border-radius:0;padding:2px 4px;-webkit-appearance:none;appearance:none}
#ledger .lbtn{background:transparent;color:var(--pr);border:1.5px solid var(--pr);border-radius:6px;font-family:var(--print)}
#ledger .lbtn.solid{background:var(--pr);color:#fff}
#ledger .accform input{font-family:var(--hand);font-size:22px}

/* totals written like a ruled summary */
#ledger .tiles{grid-template-columns:1fr;gap:0;margin:4px 0 18px;background:rgba(255,255,255,.28);border:1.5px solid var(--pr);border-radius:4px;padding:4px 14px}
#ledger .tile{background:transparent;border:0;border-bottom:1.5px dashed var(--ppl);border-radius:0;padding:8px 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#ledger .tile .k{color:var(--pr);font-size:15px;font-weight:400}
#ledger .tile .v{font-family:var(--hand);font-size:24px;font-weight:600;color:var(--pk)}
#ledger .tile.big{border-bottom:0;padding-top:10px}
#ledger .tile.big .k{font-size:17px;color:var(--pk);font-weight:600}
#ledger .tile.big .v{font-family:var(--hand);color:var(--pred);font-size:clamp(32px,9vw,42px);border-bottom:4px double var(--pred);line-height:1.1}

/* entry slip */
#ledger .lform{background:rgba(255,255,255,.4);border:1.5px solid var(--pr);border-radius:4px;box-shadow:3px 3px 0 rgba(29,76,156,.15)}
#ledger .lform.editing{border-color:var(--pred);box-shadow:3px 3px 0 rgba(179,18,43,.18)}
#ledger .lform .ft{color:var(--pr);font-size:19px}
#ledger .lform.editing .ft{color:var(--pred)}
#ledger .seg button{background:transparent;border:2px solid var(--pr);color:var(--pr);border-radius:6px;font-family:var(--print)}
#ledger .seg button[aria-pressed="true"]{background:var(--pr);color:#fff}
#ledger .lform input,#ledger .accform input{background:transparent;border:0;border-bottom:2px solid var(--pr);border-radius:0;padding:6px 2px;color:var(--pk);font-family:var(--hand);font-size:24px;font-weight:600;box-shadow:none}
#ledger .lform input:focus,#ledger .accform input:focus{border-bottom-color:var(--pred);background:rgba(255,255,255,.35)}
#ledger .lacts .lbtn{font-size:17px;padding:12px}
#ledger .lacts .del2{border-radius:6px}

/* the ledger table */
#ledger .tw{background:rgba(255,255,255,.25);border:2px solid var(--pr);border-radius:2px}
#ledger .lt th{border-color:var(--pr);font-weight:400;font-size:16px}
#ledger .lt th small{font-family:Georgia,serif}
#ledger .lt td{border-right-color:var(--pr);border-bottom-color:rgba(29,76,156,.35);font-family:var(--hand);font-size:18px;color:var(--pk);padding:8px 7px}
#ledger .lt td.n{font-family:var(--hand);font-weight:600}
#ledger .lt td.dt b{font-family:var(--hand);font-weight:600}
#ledger .lt td.dt small{font-family:var(--hand);color:var(--pmut);font-size:15px}
#ledger .lt td.bal{color:var(--pred)}
#ledger .lt tfoot td{border-top:3px double var(--pr);font-family:var(--hand)}
#ledger .lt tr.r:hover td,#ledger .lt tr.r.sel td{background:rgba(255,236,150,.45)}
#ledger .lt tr.open td{background:rgba(255,255,255,.2)}

/* =========== স্টক + দৈনিক: white notebook, pen-and-paper look =========== */
#stock,#amdani{--paper:#FBFBF6;--rule:#C7D6EB;--margin:#E28B97;--ink:#1B2347;--muted:#5E6B85;--blue:#1F4AA8;
  --red:#C0152F;--red-soft:#FBE4E7;--field:#FFFFFF;--line:#B9C8DE;--btn-text:#FFFFFF;color-scheme:light;color:var(--ink)}
body:not(.on-ledger){background-color:#FBFBF6;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#C7D6EB 35px,#C7D6EB 36px);color-scheme:light}
body:not(.on-ledger) .tabs{background:#FBFBF6;border-color:#C7D6EB}
body:not(.on-ledger) .tabs button{background:#fff;color:#1F4AA8;border-color:#B9C8DE;font-family:var(--print)}
body:not(.on-ledger) .tabs button[aria-selected="true"]{background:#1F4AA8;color:#fff;border-color:#1F4AA8}
#stock::before,#amdani::before{opacity:.9;width:1.5px;box-shadow:5px 0 0 var(--margin)}

/* printed text */
#stock .book,#stock .status,#stock .lbl,#stock label,#stock .hint,#stock section.history h2,
#amdani .status,#amdani .k,#amdani .fl,#amdani label,#amdani h2,#amdani .ssub,#amdani .cnt,#amdani .hint,#amdani .lmsg,#amdani .subtabs .st{font-family:var(--print)}
#stock .lbl,#amdani .k{color:var(--muted)}

/* handwriting (pen ink) */
#stock h1,#amdani h1{font-family:var(--hand);font-weight:600;color:var(--ink)}
#stock .dcal,#amdani .dcal{filter:grayscale(1);opacity:.55}
#stock .val,#stock .grand .total .val,#stock ol.entries .kg,#stock ol.entries .car,#stock .hist,
#amdani .srow .v,#amdani .arow2 .amt,#amdani .arow2 .nm,#amdani .combo-list .on,#amdani .combo-list .ob,#amdani .subtabs .st span{font-family:var(--hand);font-weight:600}
#stock ol.entries .kg{color:var(--red);font-size:23px}
#stock ol.entries .car{background:transparent;color:var(--ink);padding:0;font-size:19px}
#stock .grand .total .val{color:var(--red);border-bottom:4px double var(--red)}
#amdani .srow.grand2 .v{border-bottom:4px double var(--red)}
#amdani .arow2 .amt{font-size:22px}
#amdani .arow2 .nm{font-size:19px;font-weight:500}

/* inputs are lines to write on */
#stock input:not([type=date]),#amdani input:not([type=date]),#amdani select{background:transparent;border:0;border-bottom:2px solid var(--blue);border-radius:0;padding:6px 2px;
  font-family:var(--hand);font-size:22px;font-weight:600;color:var(--ink);box-shadow:none}
#stock input:focus,#amdani input:focus,#amdani select:focus{border-bottom-color:var(--red);background:rgba(31,74,168,.05);box-shadow:none}
#stock input::placeholder,#amdani input::placeholder{font-family:var(--print);font-size:16px;font-weight:400;color:#8A97AE}
#amdani .combo input{padding-right:44px}

/* slips & cards look like paper notes */
#amdani .asum,#amdani .acard,#amdani .subtabs{background:rgba(255,255,255,.75);border:1.5px solid var(--blue);border-radius:4px;box-shadow:3px 3px 0 rgba(31,74,168,.12)}
#amdani .addcard.collapsed{box-shadow:none}
#amdani .srow,#amdani .alist li,#amdani .acard-h{border-color:var(--rule)}
#amdani .subtabs .st{color:var(--blue)}
#amdani .subtabs .st[aria-selected="true"]{background:var(--blue);color:#fff}
#amdani .subtabs .st.kh{color:var(--red)}
#amdani .subtabs .st.kh[aria-selected="true"]{background:var(--red);color:#fff}
#amdani .arow2 .ic,#amdani .racts button{background:transparent}
#amdani .combo-list{background:#fff}
#amdani .aedit2,#amdani .newparty{background:#fff}
#stock .navbtn,#amdani .navbtn{background:transparent;border:1.5px solid var(--blue);color:var(--blue)}
#stock .add button,#stock .close-btn,#amdani .amtrow button{font-family:var(--print)}
#stock .hist{border-color:var(--rule)}

/* fix: ruled background lines were running through numbers/text */
:root{--ppc:#DDF1F8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ppc:#C6E3EE}}
:root[data-theme="dark"]{--ppc:#C6E3EE}
#ledger{background:var(--pp);min-height:100vh}
#ledger .tiles,#ledger .lform,#ledger .tw{background:var(--ppc)}
#ledger .lt td,#ledger .lt th{background:var(--ppc)}
#ledger .lt tr.open td{background:#D2EAF3}
#ledger .lt tr.r:hover td,#ledger .lt tr.r.sel td{background:#FFF3B8}
#ledger .lform input:focus,#ledger .accform input:focus{background:#fff}
#ledger .ldate{padding-top:8px}
#amdani .asum,#amdani .acard,#amdani .subtabs{background:#fff}
#amdani .addcard.collapsed{background:transparent}

/* খরচ (মাল কিনেছে) = red ink, জমা (টাকা দিয়েছে) = blue ink */
#ledger .seg button[data-t="credit"]{border-color:var(--pred);color:var(--pred)}
#ledger .seg button[data-t="credit"][aria-pressed="true"]{background:var(--pred);color:#fff;border-color:var(--pred)}
#ledger .lform.credit{border-color:var(--pred);box-shadow:3px 3px 0 rgba(179,18,43,.18);background:#FBEDEF}
#ledger .lform.credit .ft,#ledger .lform.credit label{color:var(--pred)}
#ledger .lform.credit input{border-bottom-color:var(--pred)}
#ledger .lform.credit .lacts .lbtn.solid{background:var(--pred);border-color:var(--pred)}
#ledger .lform.credit .lacts .lbtn:not(.solid){color:var(--pred);border-color:var(--pred)}
/* ---------- 📊 ড্যাশবোর্ড ---------- */
#dash{--paper:#FBFBF6;--rule:#C7D6EB;--margin:#E28B97;--ink:#1B2347;--muted:#5E6B85;--blue:#1F4AA8;--red:#C0152F;--line:#B9C8DE;color-scheme:light;color:var(--ink)}
#dash h1{font-family:var(--hand);font-weight:600;color:var(--ink);font-size:26px;margin:0 0 10px}
#dash .book,#dash .dh,#dash .k,#dash .s,#dash .chip,#dash .rlabel,#dash .legend,#dash .tnote,#dash .crange label{font-family:var(--print)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dt{background:#fff;border:1.5px solid var(--blue);border-radius:4px;box-shadow:3px 3px 0 rgba(31,74,168,.12);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dt .k{font-size:13.5px;color:var(--muted);line-height:1.3}
.dt .v{font-family:var(--hand);font-weight:600;font-size:clamp(20px,6vw,26px);color:var(--ink);line-height:1.2;overflow-wrap:anywhere}
.dt .s{font-size:12.5px;color:var(--muted)}
.dt.red{border-color:var(--red);box-shadow:3px 3px 0 rgba(192,21,47,.14)}
.dt.red .v{color:var(--red)}
.dt.blue .v{color:var(--blue)}
.dh{font-size:18px;color:var(--blue);margin:22px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.crange{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.crange label{font-size:13px;color:var(--muted);display:block}
.crange input{width:100%;margin-top:3px;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:8px}
.rlabel{margin:8px 0 10px;font-size:15px;color:var(--ink);font-weight:600}
.dsum{background:#fff;border:1.5px solid var(--blue);border-radius:4px;box-shadow:3px 3px 0 rgba(31,74,168,.12);padding:4px 14px}
.dsum .sr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.dsum .sr:last-child{border-bottom:0}
.dsum .k{font-size:15px;color:var(--muted)}
.dsum .v{font-family:var(--hand);font-weight:600;font-size:21px;white-space:nowrap}
.dsum .v.inc{color:var(--blue)}
.dsum .v.exp{color:var(--red)}
.dsum .sr.net{border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
.dsum .sr.net .k{color:var(--ink);font-weight:700}
.dsum .sr.net .v{font-size:25px}
.chartwrap{overflow-x:auto;background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:10px 6px 4px;position:relative}
.chartwrap svg{display:block}
.chartwrap .bi,.legend i.bi{fill:var(--blue);background:var(--blue)}
.chartwrap .be,.legend i.be{fill:var(--red);background:var(--red)}
.chartwrap .ax{stroke:var(--line);stroke-width:1.5}
.chartwrap .bl{font-size:11px;fill:var(--muted);font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif}
.dnone{color:var(--muted);font-size:14px;margin:0;padding:8px 0}
.chartwrap .dnone{position:absolute;left:12px;top:10px}
.legend{display:flex;gap:16px;align-items:center;font-size:13.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .mx{margin-left:auto}
.rank{list-style:none;margin:0;padding:0;background:#fff;border:1.5px solid var(--line);border-radius:4px}
.rank li+li{border-top:1px dashed var(--rule)}
.rp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;background:transparent;text-align:left;padding:10px 12px;color:var(--ink);border-radius:0}
.rn{font-family:var(--hand);font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{font-family:var(--hand);font-weight:600;font-size:18px;color:var(--blue)}
.rv.red{color:var(--red)}
.rbar{grid-column:1 / -1;height:6px;background:#EEF2F8;border-radius:3px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.rbar i.red{background:var(--red)}
.rank .dnone{padding:12px}
#dash .tnote{font-size:13px;color:var(--muted);margin-top:8px}
/* 4 tabs: icon on top, smaller text */
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;padding:7px 2px;line-height:1.15}
.tabs .ti{font-size:19px}
#ledger .lt td.dt small.tg{font-family:var(--print);font-size:13.5px;font-weight:600;display:block!important;width:fit-content!important;max-width:100%;line-height:1.5;margin-top:2px;padding:0 7px;border-radius:4px}
#ledger .lt td.dt small.tg-d{color:var(--pr);background:rgba(29,76,156,.10)}
#ledger .lt td.dt small.tg-c{color:var(--pred);background:rgba(179,18,43,.09)}

/* newest first + sticky column header */
#ledger .tw{overflow:visible}
#ledger table.lt{min-width:0;border-collapse:separate;border-spacing:0}
#ledger .lt thead th{position:sticky;top:var(--tabsH,72px);z-index:4;background:var(--ppc);box-shadow:0 2px 0 var(--pr)}
#ledger .lt td.n{font-size:17px;padding-left:4px;padding-right:6px}
@media (max-width:380px){#ledger .lt td.n{font-size:15.5px}}

/* fix: ruled lines were running through text on স্টক / দৈনিক / ড্যাশবোর্ড */
#stock,#amdani,#dash{background:#FBFBF6;min-height:100vh}

/* edit opens as a sheet over the page, so the page doesn't jump */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(12,24,48,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--tabsH,72px) + 8px) 10px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet{width:100%;max-width:600px}
#ledger .sheet .lform{margin:0;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#ledger .sheet #fEDate{font-family:var(--hand);font-size:20px;color:var(--pk);background:transparent;border:0;border-bottom:2px solid currentColor;border-radius:0;width:100%;padding:6px 2px;margin-bottom:10px}

.calsvg{display:inline-block;vertical-align:-0.12em}
.dpick .dcal{filter:none!important;opacity:.75!important;color:inherit}
.tabs .ti .calsvg{width:22px;height:22px;vertical-align:middle;color:#C0152F}
.tabs button[aria-selected="true"] .ti .calsvg{color:#fff}

/* অপেক্ষমাণ / নিশ্চিত */
#ledger .lt .cfm{display:block;width:fit-content;max-width:100%;margin-top:5px;padding:3px 8px;border-radius:6px;border:1.5px dashed #B7791F;background:#FFF4D6;color:#8A5A00;font-family:var(--print);font-size:13px;font-weight:600;text-align:left;line-height:1.35}
#ledger .lt .cfm span{display:block;color:var(--pr);font-weight:700}
#ledger .lt .cfm.armed{background:var(--pr);border-style:solid;border-color:var(--pr);color:#fff}
#ledger .lt .cfm.armed span{color:#fff}
#ledger .lt td.dt small.tg-ok{color:#1F7A3D;background:rgba(31,122,61,.12);margin-top:4px}
#ledger .tile.pend .k{color:#8A5A00}
#ledger .tile.pend .v{color:#8A5A00;font-size:20px}
#ledger .stline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:8px 10px;border-radius:6px;background:#FFF4D6;color:#8A5A00;font-family:var(--print);font-weight:600;font-size:14px}
#ledger .stline.ok{background:rgba(31,122,61,.12);color:#1F7A3D}
#ledger .stline .lbtn{padding:6px 10px;font-size:14px}
#stock .pendnote{margin:6px 0 0;padding:6px 10px;border-radius:6px;background:#FFF4D6;color:#8A5A00;font-family:var(--print);font-size:14px}

/* স্টক sub-tabs */
#stock .subtabs{display:grid;grid-template-columns:1fr 1fr;margin:16px 0 14px;border:1.5px solid var(--blue);border-radius:6px;overflow:hidden;background:#fff}
#stock .subtabs .st{padding:10px 6px;background:transparent;color:var(--blue);font-weight:700;font-size:16px;border-radius:0;line-height:1.25;font-family:var(--print)}
#stock .subtabs .st span{display:block;font-size:13px;font-weight:600;font-family:var(--hand)}
#stock .subtabs .st[aria-selected="true"]{background:var(--blue);color:#fff}
#stock .subtabs .st.q{color:#8A5A00}
#stock .subtabs .st.q[aria-selected="true"]{background:#B7791F;color:#fff}
.qsum{background:#fff;border:1.5px solid #B7791F;border-radius:4px;box-shadow:3px 3px 0 rgba(183,121,31,.15);padding:4px 14px;margin-bottom:6px}
.qs{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.qs:last-child{border-bottom:0}
.qs .k{font-family:var(--print);color:var(--muted);font-size:15px}
.qs .v{font-family:var(--hand);font-weight:600;font-size:21px;color:var(--ink)}
.qs .v small{font-size:14px;color:var(--muted)}
.qs.due .k{color:#8A5A00;font-weight:700}
.qs.due .v{color:#B45309;font-size:25px}
.qh{font-family:var(--print);font-size:17px;color:var(--blue);margin:18px 0 4px}
.qh.due{color:#8A5A00}
.qlist{list-style:none;margin:0;padding:0}
.qrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.qmain{min-width:0}
.qn{display:block;font-family:var(--hand);font-weight:600;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qd{display:block;font-family:var(--print);font-size:13px;color:var(--muted)}
.qkg{font-family:var(--hand);font-weight:600;font-size:20px;color:var(--red);white-space:nowrap}
.qkg small{font-size:13px;color:var(--muted)}
.qbtn{padding:8px 10px;border-radius:8px;font-family:var(--print);font-weight:700;font-size:14px;white-space:nowrap}
.qbtn.go{background:#1F7A3D;color:#fff}
.qbtn.undo{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.qbtn.armed{background:var(--red)!important;color:#fff!important;border-color:var(--red)}

/* মালের ধরন */
#ledger .lform select.mtype{display:block;width:100%;margin-top:4px;font-family:var(--hand);font-size:22px;font-weight:600;color:var(--pk);background:#fff;border:2px solid var(--pred);border-radius:8px;padding:8px 10px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--pred) 50%),linear-gradient(135deg,var(--pred) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
#ledger .ratehint{margin:4px 0 8px;font-family:var(--print);font-size:13.5px;color:var(--pmut)}
.mt{font-weight:700;padding:0 5px;border-radius:4px}
.mt-soft{color:#0F6E56;background:rgba(15,110,86,.12)}
.mt-hard{color:#6B3FA0;background:rgba(107,63,160,.12)}
/* ---------- মেমো / লেবার pages ---------- */
#memo,#labour{--paper:#FBFBF6;--rule:#C7D6EB;--margin:#E28B97;--ink:#1B2347;--muted:#5E6B85;--blue:#1F4AA8;--red:#C0152F;--line:#B9C8DE;color-scheme:light;color:var(--ink);background:#FBFBF6;min-height:100vh}
#memo h1,#labour h1{font-family:var(--hand);font-weight:600;color:var(--ink);font-size:26px;margin:0 0 10px}
#memo .book,#labour .book,#memo .chip,#labour .chip,#memo .rlabel,#labour .rlabel,#memo .crange label,#labour .crange label,#labour .tnote{font-family:var(--print)}
.kchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip.k{border-color:var(--ink);color:var(--ink)}
.chip.k[aria-pressed="true"]{background:var(--ink);color:#fff}
.msearch{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);margin:2px 0 10px;font-family:var(--print)}
.msum{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#fff;border:1.5px solid var(--blue);border-radius:4px;box-shadow:3px 3px 0 rgba(31,74,168,.12);margin-bottom:6px}
.msum div{display:flex;flex-direction:column;padding:8px 12px;border-bottom:1px dashed var(--rule)}
.msum div:nth-child(odd){border-right:1px dashed var(--rule)}
.msum span{font-family:var(--print);font-size:13px;color:var(--muted)}
.msum b{font-family:var(--hand);font-size:20px;font-weight:600}
.msum b.r{color:var(--red)} .msum b.b{color:var(--blue)}
.mg{font-family:var(--print);font-size:15px;color:var(--blue);margin:16px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--blue)}
.mlist{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:4px}
.mlist li+li{border-top:1px dashed var(--rule)}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 12px;background:transparent;text-align:left;color:var(--ink);border-radius:0}
.mrow .mn{font-family:var(--print);font-size:13px;color:var(--muted);min-width:2.6em}
.mrow .mm{min-width:0}
.mrow .mm b{display:block;font-family:var(--hand);font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mm small{display:block;font-family:var(--print);font-size:12.5px;color:var(--muted)}
.mrow .ma{font-family:var(--hand);font-weight:600;font-size:19px;white-space:nowrap}
.mrow .ma.r{color:var(--red)} .mrow .ma.b{color:var(--blue)}

/* লেবার */
.lrate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-family:var(--print);color:var(--muted)}
.lrate input{width:90px;font-family:var(--hand);font-size:22px;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--blue);border-radius:0;padding:2px 4px;text-align:center}
.lsum{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1.5px solid var(--red);border-radius:4px;box-shadow:3px 3px 0 rgba(192,21,47,.12);margin-bottom:10px}
.lsum div{display:flex;flex-direction:column;padding:8px 12px;border-bottom:1px dashed var(--rule)}
.lsum div:first-child{border-right:1px dashed var(--rule)}
.lsum div.big{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:baseline;border-bottom:0}
.lsum span{font-family:var(--print);font-size:13.5px;color:var(--muted)}
.lsum b{font-family:var(--hand);font-size:20px;font-weight:600}
.lsum .big b{font-size:28px;color:var(--red)}
.pdfbtn{display:block;width:100%;padding:12px;margin:0 0 12px;background:var(--blue);color:#fff;font-family:var(--print);font-weight:700;font-size:16px;border-radius:8px}
.pdfbtn:disabled{opacity:.7}

/* the paper sheet (screen + PDF) */
.lpaper{background:#fff;border:1px solid #E5C7CC;border-left:3px double #E28B97;border-radius:2px;padding:14px 12px 16px 16px;box-shadow:0 2px 6px rgba(0,0,0,.06);color:#1B2347}
.lp-head{text-align:center;margin-bottom:6px}
.lp-title{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-weight:700;font-size:24px;display:inline-block;border-bottom:2px solid #1B2347;padding:0 10px}
.lp-sub{font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:13px;color:#5E6B85;margin-top:4px}
.lp-row{display:grid;grid-template-columns:auto auto 1fr auto auto auto auto;gap:6px;align-items:baseline;padding:7px 2px 3px;border-bottom:1px solid #C7D6EB;font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:17px;font-weight:500;cursor:pointer}
.lp-row .dash{color:#8A97AE}
.lp-row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-row .k,.lp-row .t{white-space:nowrap;text-align:right}
.lp-row .t{font-weight:700}
.lp-row .pd{font-style:normal;font-size:13px}
.lp-row.empty{display:block;color:#5E6B85;cursor:default}
.lp-total{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:17px}
.lp-total .circ{font-size:24px;color:#C0152F;border:2px solid #C0152F;border-radius:50%;padding:4px 14px}

/* memo sheet */
.msheet-bg{position:fixed;inset:0;z-index:70;background:rgba(12,24,48,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--tabsH,72px) + 8px) 10px 14px;overflow-y:auto}
.msheet{width:100%;max-width:520px}
.mpaper{background:#FFFEF8;color:#1B2347;border-radius:4px;padding:16px 16px 14px 20px;border-left:3px double #E28B97;box-shadow:0 12px 32px rgba(0,0,0,.3);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#E3EAF5 33px,#E3EAF5 34px);color-scheme:light}
.mp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid #1B2347;padding-bottom:6px;margin-bottom:8px}
.mp-title{font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:21px;font-weight:700;color:#1F4AA8}
.mp-no{font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:14px;color:#5E6B85;text-align:right}
.mp-no b{display:block;font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:22px;color:#C0152F}
.mp-line{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;color:#5E6B85;font-size:15px}
.mp-line b{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:20px;font-weight:600;color:#1B2347;border-bottom:1.5px dotted #1F4AA8;flex:1}
.mp-tbl{width:100%;border-collapse:collapse;margin:10px 0 4px;background:#fff}
.mp-tbl th{font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-weight:400;color:#1F4AA8;font-size:14px;border:1px solid #1F4AA8;padding:5px}
.mp-tbl td{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:17px;font-weight:600;border:1px solid #9DB1D6;padding:6px;text-align:right}
.mp-tbl td:first-child{text-align:left}
.mp-tbl tfoot td{border-top:2px solid #1F4AA8;color:#C0152F}
.mp-pay{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;padding:10px 12px;background:rgba(31,74,168,.08);border-radius:4px;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;color:#1F4AA8}
.mp-pay b{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:24px}
.mp-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:16px}
.mp-total b{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:28px;color:#C0152F;border-bottom:4px double #C0152F}
.mp-status{margin-top:10px;padding:7px 10px;border-radius:6px;background:#FFF4D6;color:#8A5A00;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:14px;font-weight:600}
.mp-status.ok{background:rgba(31,122,61,.12);color:#1F7A3D}
.mp-bal{margin-top:12px;border:1.5px solid #1F4AA8;border-radius:4px;background:#fff}
.mp-bal div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px dashed #C7D6EB;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:14px;color:#5E6B85}
.mp-bal div:last-child{border-bottom:0}
.mp-bal b{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:18px;color:#1B2347}
.mp-bal .now span{color:#1B2347;font-weight:700}
.mp-bal .now b{color:#C0152F;font-size:22px}
.mp-sign{display:flex;justify-content:space-between;margin-top:56px;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:13px;color:#5E6B85}
.mp-sign span{border-top:1px solid #1B2347;padding-top:4px;min-width:150px;text-align:center}
.m-acts1{margin-top:10px}
.m-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.mbtn{padding:12px 8px;border-radius:8px;background:#1F4AA8;color:#fff;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-weight:700;font-size:15px;width:100%}
.mbtn.ghost{background:#fff;color:#1F4AA8;border:1.5px solid #1F4AA8}
.mbtn.green{background:#1F7A3D}
.mbtn.green.armed{background:#C0152F}
body.memo-open{overflow:hidden}

/* PDF rendering area (off screen, A4 width) */
.pdfholder{position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1}
.pdfholder .lpaper,.pdfholder .mpaper{border:0;box-shadow:none;border-radius:0;padding:48px 56px 56px 64px;border-left:4px double #E28B97;background-image:none;background:#fff}
.pdfholder .lp-row{font-size:19px;padding:9px 2px 5px;grid-template-columns:auto auto 1fr auto auto auto auto}
.pdfholder .lp-title{font-size:30px}
.pdfholder .lp-sub{font-size:15px}
.pdfholder .mpaper{font-size:18px}

/* ধরন chips in the খরচ form */
#ledger .fl2{font-family:var(--print);color:var(--pred);font-weight:600;font-size:14px;margin:6px 0 4px}
#ledger .fl2 small{font-weight:400;color:var(--pmut)}
#ledger .mtchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ledger .mtc{padding:10px;border-radius:8px;font-family:var(--print);font-weight:700;font-size:16px;background:#fff;border:2px solid currentColor}
#ledger .mtc-soft{color:#0F6E56}
#ledger .mtc-hard{color:#6B3FA0}
#ledger .mtc[aria-pressed="true"]{color:#fff}
#ledger .mtc-soft[aria-pressed="true"]{background:#0F6E56;border-color:#0F6E56}
#ledger .mtc-hard[aria-pressed="true"]{background:#6B3FA0;border-color:#6B3FA0}
#ledger .mtc[aria-pressed="true"]::before{content:"✓ "}
#ledger .mtrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;align-items:end;padding:8px 10px;margin:8px 0;border-radius:8px;background:#fff;border-left:5px solid currentColor}
#ledger .mtrow-soft{color:#0F6E56}
#ledger .mtrow-hard{color:#6B3FA0}
#ledger .mtrow .mtl{font-family:var(--print);font-weight:700;font-size:15px;align-self:center}
#ledger .mtrow label{color:inherit!important;font-size:13px}
#ledger .mtrow input{border-bottom-color:currentColor!important;font-size:21px}
#ledger .mtrow .mtsub{grid-column:2 / -1;font-family:var(--hand);font-weight:600;font-size:15px;text-align:right;min-height:1em}
#ledger .mtrow[hidden]{display:none}

/* 6 tabs */
.tabs{gap:4px;padding:6px 6px}
.tabs button{font-size:12px;padding:6px 1px;border-radius:9px}
.tabs .ti{font-size:17px}
.tabs .ti .calsvg{width:19px!important;height:19px!important}

.mrow .mm small b.mt{display:inline;font-family:var(--print);font-size:12px;white-space:nowrap}
/* লেবার rows: phone = date | name over kg | taka ; PDF = one line with dashes */
.lp-row{grid-template-columns:auto 1fr auto!important;grid-template-areas:"d n t" "d k t";gap:0 10px!important;align-items:center!important}
.lp-row .d{grid-area:d;font-size:15px;color:#5E6B85}
.lp-row .n{grid-area:n;font-weight:600}
.lp-row .k{grid-area:k;text-align:left!important;font-size:14px;color:#5E6B85}
.lp-row .t{grid-area:t;font-size:18px}
.pdfholder .lp-row{grid-template-columns:auto auto 1fr auto auto auto auto!important;grid-template-areas:none;align-items:baseline!important}
.pdfholder .lp-row>*{grid-area:auto!important}
.pdfholder .lp-row .d{font-size:19px;color:#1B2347}
.pdfholder .lp-row .n::before,.pdfholder .lp-row .k::before,.pdfholder .lp-row .t::before{content:"— ";color:#8A97AE}
.pdfholder .lp-row{grid-template-columns:auto 1fr auto auto!important}
.pdfholder .lp-row .k{font-size:19px;color:#1B2347;text-align:right!important}
.pdfholder .lp-row .t{font-size:19px}

/* লেবার in the খরচ form */
#ledger .labbox{margin:10px 0 4px;padding:10px 12px;border-radius:8px;background:#fff;border:1.5px dashed var(--pred)}
#ledger .labtog{display:flex;align-items:center;gap:8px;font-family:var(--print);font-weight:700;font-size:15px;color:var(--pred)!important}
#ledger .labtog input{width:20px!important;height:20px;accent-color:var(--pred);border:0!important;padding:0!important;margin:0}
#ledger .labtog small{font-weight:400;color:var(--pmut)}
#ledger .labcalc div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #E5C7CC;font-family:var(--print);font-size:14px;color:var(--pmut)}
#ledger .labcalc b{font-family:var(--hand);font-size:18px;color:var(--pk);white-space:nowrap}
#ledger .labcalc .adj b{color:#B45309}
#ledger .labcalc .tot{border-bottom:0;border-top:2px solid var(--pred);margin-top:2px}
#ledger .labcalc .tot span{color:var(--pk);font-weight:700}
#ledger .labcalc .tot b{color:var(--pred);font-size:22px}
#ledger .lc-note{margin:6px 0 0;font-family:var(--print);font-size:13px;color:var(--pmut)}
.mp-tbl tr.lab td{color:#B45309}
.mp-tbl tr.adj td{color:#8A5A00;font-size:15px}
.lp-row .t small.adj{display:block;font-size:12px;font-weight:500;color:#B45309;text-align:right}
/* ===== cash memo, paper style ===== */
.cm{--br:#7A4A1E;--brl:#A87A46;--cream:#FBF4DF;--gold:#B8860B;--ink:#16224F;--red:#C62828;
  position:relative;background:var(--cream);color:var(--ink);border:6px solid var(--br);border-radius:4px;padding:12px 12px 10px;
  background-image:radial-gradient(circle at 85% 70%,rgba(184,134,11,.08) 0 18%,transparent 19%),radial-gradient(circle at 10% 90%,rgba(184,134,11,.06) 0 14%,transparent 15%);
  box-shadow:0 12px 32px rgba(0,0,0,.3);color-scheme:light}
.cm-head{display:flex;align-items:center;gap:8px}
.cm-logo{width:46px;height:46px;flex:none}
.cm-names{flex:1;min-width:0;text-align:center}
.cm-bn{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-weight:700;font-size:clamp(19px,5.6vw,26px);line-height:1.1;color:var(--gold);text-shadow:0 1px 0 #6b4a00,0 0 1px #fff}
.cm-en{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(14px,4.2vw,19px);color:#8A8A8A;text-shadow:0 1px 0 #fff,0 -1px 0 #666;letter-spacing:.2px}
.cm-tag{text-align:center;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:12px;color:#5B1F5E;margin-top:4px;line-height:1.35}
.cm-addr{text-align:center;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-weight:700;font-size:13px;color:#6A1B4D}
.cm-phone{text-align:center;font-family:Arial,sans-serif;font-weight:700;font-size:12.5px;color:#2A2A6A}
.cm-meta{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;margin-top:8px}
.cm-no{display:flex;align-items:baseline;gap:4px;font-family:"Tiro Bangla",serif;color:var(--br);font-size:13px}

#settings{--paper:#FBFBF6;--rule:#C7D6EB;--ink:#1B2347;--muted:#5E6B85;--blue:#1F4AA8;--red:#C0152F;--line:#B9C8DE;color-scheme:light;color:var(--ink);background:#FBFBF6;min-height:100vh}
#settings h1{font-family:var(--hand);font-weight:600;font-size:26px;margin:0 0 12px}
#settings .book{font-family:var(--print)}
.setcard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.setcard h2{font-family:var(--print);font-size:17px;color:var(--blue);margin:0 0 8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setrow.col{flex-direction:column;align-items:stretch}
.st-tx b{display:block;font-family:var(--print);font-size:16px}
.st-tx small{display:block;font-family:var(--print);font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.tgl{flex:none;width:54px;height:32px;border-radius:999px;background:#C9D1DF;position:relative;padding:0;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tgl[aria-checked="true"]{background:#1F7A3D}
.tgl[aria-checked="true"] i{left:25px}
.st-try{margin-top:10px}
.st-try label{display:block;font-family:var(--print);font-size:13px;color:var(--muted);margin-bottom:3px}
.st-try input{width:100%;font-family:var(--hand);font-size:20px;font-weight:600;color:var(--ink);background:#F7F9FC;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg2 button{padding:10px;font-family:var(--print);font-weight:700;font-size:15px;background:#fff;color:var(--muted);border-radius:0}
.seg2 button[aria-pressed="true"][data-sm="paper"]{background:#7A4A1E;color:#fff}
.seg2 button[aria-pressed="true"][data-sm="digital"]{background:#1F4AA8;color:#fff}
.seg2 button[aria-pressed="true"][data-sf="paper"]{background:#7A4A1E;color:#fff}
.seg2 button[aria-pressed="true"][data-sf="digital"]{background:#1F4AA8;color:#fff}
.st-num{display:flex;align-items:center;gap:6px;flex:none;font-family:var(--print);color:var(--muted)}
.st-num input{width:80px;text-align:center;font-family:var(--hand);font-size:22px;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--blue);border-radius:0;padding:2px}
.cm-edit .ratehint{display:none!important}
.bnkey{display:none!important}   /* turned on/off only from ⚙️ সেটিং now */
/* memo form rows: type tag + description on ONE line, every cell lined up in the middle */
.cm-edit .cm-tbl td{vertical-align:middle!important}
.cm-edit .cm-tbl td.d{white-space:nowrap}
.cm-edit .cm-tbl td.d .mt{display:inline-block;vertical-align:middle;font-size:11.5px!important;padding:1px 5px;margin-right:3px}
#lhost .cm-edit .cm-tbl td.d .mt + input.cm-desc,#ledger .cm-edit .cm-tbl td.d .mt + input.cm-desc{display:inline-block;vertical-align:middle;width:calc(100% - 44px)!important;margin-top:0!important}
#lhost .cm-edit .cm-tbl input,#ledger .cm-edit .cm-tbl input{height:32px}
.cm-edit .cm-tbl td.v span[id^="sub_"]{font-size:13px;white-space:nowrap}
#ledger .lt td.bal.adv{color:#1F7A3D!important;background:rgba(31,122,61,.10)!important}
#ledger .lt td.bal.adv small{display:block;font-family:var(--print);font-size:11.5px;font-weight:700;line-height:1.1}
#ledger .tile.big.adv .k{color:#1F7A3D}
#ledger .tile.big.adv .v{color:#1F7A3D!important;border-bottom-color:#1F7A3D!important}
/* pop-up box */
.kdlg-bg{position:fixed;inset:0;z-index:120;background:rgba(12,24,48,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:kdf .15s ease-out}
@keyframes kdf{from{opacity:0}to{opacity:1}}
.kdlg{width:100%;max-width:360px;background:#FFFEF8;border-radius:16px;padding:20px 18px 16px;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.35);border-top:6px solid #7A4A1E;color:#1B2347;color-scheme:light;animation:kdp .18s ease-out}
@keyframes kdp{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.kdlg.ok{border-top-color:#1F7A3D}
.kd-ic{font-size:40px;line-height:1}
.kdlg h3{font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:21px;margin:8px 0 10px;color:#7A4A1E}
.kdlg.ok h3{color:#1F7A3D}
.kd-body{text-align:left}
.kd-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px dashed #E1D3B8;font-family:"Tiro Bangla",serif;font-size:14px;color:#6B5A3E}
.kd-row b{font-family:"Atma","Noto Sans Bengali","Hind Siliguri",cursive;font-size:19px;font-weight:600;color:#1B2347;text-align:right}
.kd-note{margin:10px 0 0;font-family:"Tiro Bangla",serif;font-size:13px;color:#6B7690;text-align:center}
.kd-acts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
.kd-acts.two{grid-template-columns:1fr 1.4fr}
.kd-acts button{padding:13px 8px;border-radius:10px;font-family:"Tiro Bangla",serif;font-weight:700;font-size:16px}
.kd-ok{background:#7A4A1E;color:#fff}
.kdlg.ok .kd-ok{background:#1F7A3D}
.kd-c{background:#fff;color:#7A4A1E;border:1.5px solid #7A4A1E}
.kd-row b small{font-family:"Tiro Bangla",serif;font-size:12px;font-weight:400;color:#6B5A3E}
.kd-row.tot{border-bottom:0;border-top:2px solid #7A4A1E;margin-top:2px}
.kd-row.tot span{color:#7A4A1E;font-weight:700}
.kd-row.tot b{color:#C0152F;font-size:22px}
.ktoast{position:fixed;left:50%;top:calc(var(--tabsH,72px) + 10px);z-index:130;transform:translate(-50%,-140%);opacity:0;transition:transform .3s ease,opacity .3s ease;
  width:calc(100% - 24px);max-width:440px;background:#1F7A3D;color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 10px 26px rgba(0,0,0,.3);cursor:pointer}
.ktoast.in{transform:translate(-50%,0);opacity:1}
.ktoast b{display:block;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:16px}
.ktoast span{display:block;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:13.5px;opacity:.92;margin-top:1px}
.mrow .mm small em.gst{font-style:normal;font-weight:700;color:#8A5A00;background:#FFF1C9;padding:0 6px;border-radius:999px;white-space:nowrap}
.mrow .mm small em.gst.ok{color:#1F7A3D;background:#DDF2E4}
.m-paynote{background:#EEF3FB;color:#1F4AA8;border:1.5px dashed #1F4AA8;border-radius:10px;padding:10px 12px;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:14px;text-align:center}
/* ================= DESKTOP: clean dashboard layout (phones unchanged) ================= */
@media (min-width: 900px){
  :root{--side:224px;--dbg:#F3F5F9;--card:#FFFFFF;--bd:#E3E8F0;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06)}

  /* side menu */
  .tabs{position:fixed!important;top:0;left:0;bottom:0;width:var(--side);flex-direction:column!important;align-items:stretch;
    overflow-y:auto!important;overflow-x:hidden!important;background:#fff!important;border:0!important;border-right:1px solid var(--bd)!important;
    padding:84px 12px 16px!important;gap:2px!important;z-index:30;scroll-snap-type:none}
  .tabs::before{content:"হিসাব খাতা";position:absolute;top:22px;left:22px;right:16px;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:22px;font-weight:700;color:#1F4AA8;
    padding-bottom:14px;border-bottom:1px solid var(--bd)}
  .tabs button{flex-direction:row!important;justify-content:flex-start!important;align-items:center;gap:12px!important;min-width:0!important;width:100%;
    padding:11px 14px!important;border:0!important;border-radius:10px!important;background:transparent!important;color:#3A4560!important;
    font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif!important;font-size:15.5px!important;font-weight:600;text-align:left;box-shadow:none!important}
  .tabs button:hover{background:#F3F6FB!important}
  .tabs button[aria-selected="true"]{background:#EAF0FC!important;color:#1F4AA8!important;font-weight:700}
  .tabs .ti{font-size:19px!important;width:24px;text-align:center}

  /* page area */
  main.wrap,main.lwrap{margin:0 0 0 var(--side)!important;max-width:none!important;min-height:100vh;
    padding:32px max(36px, calc((100vw - var(--side) - 1120px) / 2)) 64px!important}

  /* page titles */
  main header h1{font-size:30px!important}
  main header .book{font-size:13px;letter-spacing:.3px;text-transform:none;color:#6B7690!important}

  /* ---------- স্টক: summary on the left, work area on the right ---------- */
  #stock{display:grid!important;grid-template-columns:minmax(0,0.9fr) minmax(0,1.25fr);column-gap:28px;align-items:start;grid-auto-flow:row dense}
  #stock>*{grid-column:2}
  #stock>header,#stock>.loading{grid-column:1 / -1}
  #stock>.calc,#stock>.grand{grid-column:1}
  body.theme-pro #stock>.calc,body.theme-pro #stock>.grand,body.theme-pro #stock>.add,body.theme-pro #stock>ol.entries,body.theme-pro #stock>.qsum,body.theme-pro #stock>.qlist{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow)}
  #stock>.calc{padding:8px 20px 14px;margin:0 0 18px}
  #stock>.grand{padding:6px 20px 16px;margin:0}
  #stock>.add{padding:16px 18px;margin:0 0 6px;align-items:end}
  #stock>ol.entries{padding:4px 18px;margin-top:8px}
  #stock>.subtabs{margin-top:0!important}
  #stock>.qsum{padding:6px 18px}
  #stock>.qlist{padding:2px 16px}
  #stock header .datebar h1{font-size:30px}

  /* ---------- খতিয়ান: summary + টাকা জমা side by side in one row, full-width table below ---------- */
  #ledger{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px;align-items:stretch;grid-auto-flow:row}
  #ledger>*{grid-column:1 / -1}
  #ledger>.tiles{grid-column:1;margin:0 0 20px!important}
  #ledger>.lform{grid-column:2;margin:0 0 20px!important}
  body.theme-pro #ledger .tiles,body.theme-pro #ledger .lform{box-shadow:var(--shadow)!important;border-radius:12px!important}
  #ledger .lt thead th{top:0}

  /* ---------- ড্যাশবোর্ড ---------- */
  .dgrid{grid-template-columns:repeat(4,1fr)!important;gap:14px!important}
  body.theme-pro #dash .dt,body.theme-pro .dsum,body.theme-pro .chartwrap,body.theme-pro .rank{border-radius:12px!important;box-shadow:var(--shadow)!important;border-color:var(--bd)!important}

  /* ---------- cards everywhere: softer, rounder ---------- */
  body.theme-pro .asum,body.theme-pro .acard,body.theme-pro .msum,body.theme-pro .lsum,body.theme-pro .setcard,body.theme-pro .mlist,body.theme-pro .lpaper{border-radius:12px!important;box-shadow:var(--shadow)!important;border-color:var(--bd)!important}
  .newmemo{border-radius:12px!important}
  .msheet-bg,.sheet-bg{padding-left:calc(var(--side) + 20px)!important}
  .ktoast{left:calc(50% + var(--side) / 2)}
}

@media (min-width: 900px){
  #stock{grid-auto-flow:row!important}
  #stock>.scol-l{grid-column:1!important;position:sticky;top:24px}
  #stock>.scol-r{grid-column:2!important}
  body.theme-pro #stock .scol-l>.calc,body.theme-pro #stock .scol-l>.grand,body.theme-pro #stock .scol-r>.add,body.theme-pro #stock .scol-r>ol.entries,body.theme-pro #stock .scol-r>.qsum,body.theme-pro #stock .scol-r>.qlist{background:#fff;border:1px solid #E3E8F0;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06)}
  #stock .scol-l>.calc{padding:8px 20px 14px;margin:0 0 16px}
  #stock .scol-l>.grand{padding:6px 20px 16px;margin:0}
  #stock .scol-r>.subtabs{margin-top:0!important}
  #stock .scol-r>.add{padding:16px 18px;margin:12px 0 4px;align-items:end}
  #stock .scol-r>ol.entries{padding:4px 18px;margin-top:10px}
  #stock .scol-r>.qsum{padding:6px 18px;margin-top:12px}
  #stock .scol-r>.qlist{padding:2px 16px}
  #stock>header{margin-bottom:18px}
  #stock,#ledger{align-content:start}
  #stock[hidden],#ledger[hidden],#amdani[hidden],#memo[hidden],#labour[hidden],#dash[hidden],#settings[hidden]{display:none!important}
  /* page header (date) stays at the top while you scroll */
  main.wrap>header,#ledger>.ldate{position:sticky;top:0;z-index:25;background:#FBFBF6;margin-top:-32px!important;padding-top:24px!important;padding-bottom:12px!important;box-shadow:0 1px 0 var(--bd)}
  #stock>header{margin-bottom:18px}
  #stock .scol-l{top:150px!important}
  #ledger>.ldnote{margin-top:6px}
  #ledger .lt thead th{top:var(--ldH,84px)!important}
}
/* ===================== SIDE MENU extras (computer) ===================== */
.nav-brand,.nav-grp,.nav-foot{display:none}
@media (min-width: 900px){
  main.wrap,main.lwrap{max-width:calc(var(--side) + 1340px)!important;padding:32px 32px 64px!important}
  .tabs::before{content:none!important;display:none!important}
  .tabs{padding:14px 12px!important}
  .nav-brand,.nav-grp,.nav-foot{display:flex!important}
  .nav-brand{order:0;align-items:center;gap:10px;padding:6px 8px 16px;margin-bottom:6px;border-bottom:1px solid var(--bd)}
  .nav-brand .cm-logo{width:40px;height:40px;flex:none}
  .nav-brand b{display:block;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:14.5px;font-weight:700;color:#162033;line-height:1.25}
  .nav-brand small{display:block;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:12px;color:#667085}
  .nav-grp{font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:11.5px;font-weight:700;color:#98A2B3;letter-spacing:.3px;padding:14px 14px 4px}
  .nav-grp.g1{order:1} .tabs button[data-tab="stock"]{order:2} .tabs button[data-tab="amdani"]{order:3} .tabs button[data-tab="memo"]{order:4}
  .nav-grp.g2{order:5} .tabs button[data-tab="ledger"]{order:6} .tabs button[data-tab="labour"]{order:7}
  .nav-grp.g3{order:8} .tabs button[data-tab="dash"]{order:9} .tabs button[data-tab="settings"]{order:10}
  .nav-foot{order:11;margin-top:auto;flex-direction:column;gap:1px;padding:12px 14px 4px;border-top:1px solid var(--bd);font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:12px;color:#667085}
  .nav-foot b{font-size:14px;color:#162033}

  /* two-column pages: controls left, list right (no empty gaps) */
  .split{display:grid!important;grid-template-columns:minmax(300px,370px) minmax(0,1fr);column-gap:24px;align-items:start;align-content:start}
  .split>header{grid-column:1 / -1}
  .split>.scol-l{position:sticky;top:118px;min-width:0}
  .split>.scol-r{min-width:0}
  .split>.scol-l>*{margin-top:0!important;margin-bottom:14px!important}
  .split>.scol-r>*:first-child{margin-top:0!important}
  #settings{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-content:start}
  #settings>header{grid-column:1 / -1}
  .mstyle{flex-direction:column;align-items:stretch!important}
  .mstyle .sw{width:100%}
}

/* ===================== PRO THEME (clean office look) ===================== */
body.theme-pro{--pb:#F5F7FB;--pbd:#E4E8EF;--pi:#162033;--pm:#667085;--pblue:#2457C5;--pred:#C62828;--pgreen:#1F7A3D}
body.theme-pro,body.theme-pro.on-ledger,body.theme-pro:not(.on-ledger){background:var(--pb)!important;background-image:none!important}
body.theme-pro main.wrap,body.theme-pro main.lwrap{background:transparent!important}
body.theme-pro .wrap::before,body.theme-pro #ledger::before{display:none!important}
body.theme-pro #stock,body.theme-pro #amdani,body.theme-pro #dash,body.theme-pro #memo,body.theme-pro #labour,body.theme-pro #settings{
  --ink:#162033;--muted:#667085;--blue:#2457C5;--red:#C62828;--line:#E4E8EF;--rule:#EEF1F5;--paper:#fff;background:transparent!important}
body.theme-pro #ledger{background:transparent!important}
/* white cards on the খতিয়ান page — but the ledger table (.tw) keeps its blue ledger colours */
body.theme-pro #ledger>:not(.tw){--pp:#F5F7FB;--ppc:#FFFFFF;--ppl:#E4E8EF;--pr:#2457C5;--pk:#162033;--pred:#C62828;--pmut:#667085}
/* one clean font everywhere (the printable paper keeps its own) */
body.theme-pro main :is(h1,h2,h3,p,b,span,div,label,small,td,th,input,select,button,li,em,strong,i):not(.lpaper):not(.lpaper *):not(.tw *){font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif!important}
body.theme-pro .tabs button{font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif!important}
body.theme-pro main{font-variant-numeric:tabular-nums}
body.theme-pro main h1{font-weight:700!important;color:var(--pi)!important;letter-spacing:-.2px}
body.theme-pro main h2{color:var(--pi)!important}
body.theme-pro main .book{color:var(--pm)!important;font-size:13px!important}
body.theme-pro .dcal{opacity:.6!important}

/* cards */
body.theme-pro :is(#stock .calc,#stock .grand,#stock .add,#stock ol.entries,#stock .qsum,#stock .qlist,#ledger .tiles,#ledger .lform,.asum,.acard:not(.collapsed),.subtabs,.msum,.mlist,.ftoggle,.fpanel,.lsum,.lrate,#dash .dt,.dsum,.chartwrap,.rank,.setcard){
  background:#fff!important;border:1px solid var(--pbd)!important;border-radius:12px!important;box-shadow:0 1px 2px rgba(16,24,40,.05)!important}
body.theme-pro .ftoggle[aria-expanded="true"]{border-bottom-left-radius:0!important;border-bottom-right-radius:0!important}
body.theme-pro .fpanel{border-top:0!important;border-top-left-radius:0!important;border-top-right-radius:0!important}
body.theme-pro #stock .calc{padding:6px 16px 12px}
body.theme-pro #stock .grand{padding:6px 16px 14px;margin-top:12px}
body.theme-pro #stock .rule-red{background:var(--pbd)!important;height:1px!important}
body.theme-pro #stock .grand .total .val,body.theme-pro .srow.grand2 .v,body.theme-pro #ledger .tile.big .v{border-bottom:0!important}
body.theme-pro #stock ol.entries .kg{color:var(--pi)!important;font-size:18px!important;font-weight:600!important}
body.theme-pro #stock ol.entries .car{color:var(--pm)!important;font-size:15px!important;font-weight:500!important}

/* inputs: neat boxes */
body.theme-pro main input:not([type=date]):not([type=checkbox]),body.theme-pro main select,body.theme-pro #lhost input:not([type=date]):not([type=checkbox]):not(.cm-edit input),body.theme-pro #lhost select:not(.cm-edit select){
  background:#fff!important;border:1px solid #D0D5DD!important;border-radius:8px!important;padding:9px 12px!important;font-size:16px!important;font-weight:500!important;color:var(--pi)!important;box-shadow:none!important}
body.theme-pro main input:not([type=date]):not([type=checkbox]):focus,body.theme-pro main select:focus{border-color:var(--pblue)!important;box-shadow:0 0 0 3px rgba(36,87,197,.15)!important;outline:none}
body.theme-pro .combo input{padding-right:44px!important}
body.theme-pro .navbtn{background:#fff!important;border:1px solid #D0D5DD!important;color:#344054!important;border-radius:8px!important}

/* খতিয়ান: clean table */
body.theme-pro #ledger .acct{border-bottom:0!important}
body.theme-pro #ledger .acct select{font-size:18px!important;font-weight:600!important;text-align:left}
body.theme-pro #ledger .lbtn{border-radius:8px!important}

/* ড্যাশবোর্ড KPI cards */
body.theme-pro #dash .dt{border-left:4px solid var(--pblue)!important}
body.theme-pro #dash .dt.red{border-left-color:var(--pred)!important}
body.theme-pro #dash .dt.blue{border-left-color:var(--pgreen)!important}
body.theme-pro #dash .dt .v{font-weight:700!important}

/* tabs (phone) */
body.theme-pro .tabs{background:#fff!important;border-color:var(--pbd)!important}
body.theme-pro .tabs button{background:#fff!important;color:#344054!important;border:1px solid #E4E8EF!important}
body.theme-pro .tabs button[aria-selected="true"]{background:#EAF0FC!important;color:#2457C5!important;border-color:#C9D7F5!important}
@media (min-width: 900px){
  body.theme-pro .tabs button{border:0!important}
  body.theme-pro main.wrap>header,body.theme-pro #ledger>.ldate{background:var(--pb)!important}
}

/* settings: design picker */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line,#E4E8EF);border-radius:10px;overflow:hidden;margin-top:8px}
.seg3 button{padding:10px 6px;font-weight:700;font-size:14.5px;background:#fff;color:#667085;border-radius:0}
.seg3 button+button{border-left:1px solid #E4E8EF}
.seg3 button[aria-pressed="true"]{background:#2457C5;color:#fff}

/* ===== খাতা design on a computer: same paper colours + lines as the phone, side menu in paper colours ===== */

/* ================= 🏭 কোম্পানি খাতা (green ledger, different from the blue খতিয়ান) ================= */
.coy{--cy:#2E7D4F;--cyd:#17402A;--cyp:#DCEFDD;--cyc:#E9F6EA;--cyl:#8CC59A;--cyr:#B3122B;color:var(--cyd)}
#company header .book{margin:0;font-family:"Tiro Bangla",serif;font-size:13px;color:#4E6B57}
#company header h1{margin:2px 0 14px;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:28px;color:#1F5E3A}
.coy .cy-new{background:var(--cyc);border:1.5px solid var(--cy);border-radius:10px;padding:14px}
.coy .cy-new h3{margin:0 0 4px;font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:19px;color:var(--cy)}
.coy .cy-hint,.coy .cy-note{font-family:"Tiro Bangla","Noto Sans Bengali","Hind Siliguri",serif;font-size:13px;color:#4E6B57;margin:0 0 8px}
.coy .cy-note{margin:8px 0 0}
#company.coy input{width:100%;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:17px;font-weight:600;color:var(--cyd);background:#fff;border:1.5px solid var(--cyl);border-radius:8px;padding:8px 10px}
